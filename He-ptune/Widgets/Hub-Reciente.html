<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: #2563eb; --accent-soft: rgba(37, 99, 235, 0.15); --accent-line: rgba(37, 99, 235, 0.4);
    --text: #0b1220; --muted: #64748b; --line: rgba(15, 23, 42, 0.08);
  }
  html[data-modo="oscuro"] {
    --text: #f4f4f6; --muted: #9ea1aa; --line: rgba(255, 255, 255, 0.09);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: var(--text); font-family: 'Segoe UI Variable', system-ui, sans-serif; }
  .w { height: 100%; box-sizing: border-box; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; }
  .title { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
  .title svg { width: 15px; height: 15px; color: var(--accent); flex-shrink: 0; }
  .tag { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  
  /* --- SCROLLBAR AÑADIDA --- */
  .list { 
    flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; 
    padding-right: 4px; /* Separación para que el texto no toque la barra */
  }
  .list::-webkit-scrollbar { width: 4px; }
  .list::-webkit-scrollbar-track { background: transparent; }
  .list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .list::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  /* -------------------------- */

  .post { padding: 7px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .post:last-child { border-bottom: none; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); }
  .autor { font-weight: 700; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .hora { white-space: nowrap; flex-shrink: 0; }
  .texto { margin-top: 2px; font-size: 12px; line-height: 1.4; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .estado { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; color: var(--muted); padding: 8px; }
  .estado.error { color: #ef4444; }
</style>
</head>
<body>
<div class="w">
  <div class="head">
    <div class="title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Hub reciente
    </div>
    <span class="tag">Global</span>
  </div>
  <div class="list" id="lista"><div class="estado">Cargando...</div></div>
</div>

<script>
  const SUPABASE_URL = 'https://qcdbxudbgsnnszofdstw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_abk07LpnHxDhxM3EDyiRJg_YQGV8pI1';
  const MAX_POSTS = 4;
  const REFRESH_MS = 60000;

  const lista = document.getElementById('lista');
  const rtf = new Intl.RelativeTimeFormat('es', { numeric: 'auto' });
  const headers = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };

  async function consulta(ruta) {
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + ruta, { headers });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  function tiempo(iso) {
    const seg = (new Date(iso).getTime() - Date.now()) / 1000;
    const abs = Math.abs(seg);
    if (abs < 60) return 'ahora';
    if (abs < 3600) return rtf.format(Math.round(seg / 60), 'minute');
    if (abs < 86400) return rtf.format(Math.round(seg / 3600), 'hour');
    return rtf.format(Math.round(seg / 86400), 'day');
  }

  function mostrarEstado(texto, esError) {
    lista.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'estado' + (esError ? ' error' : '');
    d.textContent = texto;
    lista.appendChild(d);
  }

  async function cargar() {
    try {
      const posts = await consulta(`posts?select=content,created_at,author_id&order=created_at.desc&limit=${MAX_POSTS}`);
      if (!posts.length) return mostrarEstado('Todavía no hay publicaciones');

      const ids = [...new Set(posts.map(p => p.author_id).filter(Boolean))];
      const nombres = {};
      if (ids.length) {
        const perfiles = await consulta(`profiles?select=id,display_name&id=in.(${ids.join(',')})`);
        perfiles.forEach(p => { nombres[p.id] = p.display_name; });
      }

      lista.innerHTML = '';
      posts.forEach(p => {
        const item = document.createElement('div');
        item.className = 'post';

        const meta = document.createElement('div');
        meta.className = 'meta';
        const autor = document.createElement('span');
        autor.className = 'autor';
        autor.textContent = nombres[p.author_id] || 'Anónimo';
        const hora = document.createElement('span');
        hora.className = 'hora';
        hora.textContent = tiempo(p.created_at);
        meta.append(autor, hora);

        const texto = document.createElement('div');
        texto.className = 'texto';
        texto.textContent = p.content;

        item.append(meta, texto);
        lista.appendChild(item);
      });
    } catch (e) {
      mostrarEstado('No se pudo cargar el Hub', true);
    }
  }

  cargar();
  setInterval(cargar, REFRESH_MS);
</script>
</body>
</html>
