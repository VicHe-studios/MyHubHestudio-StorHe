<div class="qw" id="qw" role="button" tabindex="0" title="Abrir QR-He">
  <img id="qw-img" alt="QR Favorito" style="display:none;">
  <div class="qw-placeholder" id="qw-placeholder">
    <i data-lucide="qr-code"></i>
    <span>Sin Fav</span>
  </div>
</div>

<style>
  html, body { margin: 0; height: 100%; width: 100%; }
  * { box-sizing: border-box; }
  .qw {
    width: 100%; height: 100%; position: relative;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; padding: 4px;
    transition: transform .15s ease;
  }
  .qw:active { transform: scale(0.96); }
  
  .qw img {
    width: 100%; height: 100%; object-fit: contain;
    border-radius: 8px; background: #fff; display: block;
  }
  
  .qw-placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; color: var(--muted, #64748b);
    background: var(--field, #f6f8fb); border-radius: 8px;
    border: 1px dashed var(--line, rgba(15,23,42,0.08));
    gap: 4px;
  }
  .qw-placeholder svg { width: 24px; height: 24px; opacity: 0.5; }
  .qw-placeholder span { font-size: 10px; font-weight: 700; text-transform: uppercase; }
</style>

<script>
  if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'myhub:tema:res') {
      document.documentElement.dataset.modo = e.data.modo;
      if (e.data.color) document.documentElement.style.setProperty('--accent', e.data.color);
    }
  });

  const KEY = 'qr-he:history';
  const imgEl = document.getElementById('qw-img');
  const phEl  = document.getElementById('qw-placeholder');

  function refresh() {
    try {
      const history = JSON.parse(localStorage.getItem(KEY) || '[]');
      // Buscar ESTRICTAMENTE el favorito
      const favorite = history.find(i => i.favorite);

      if (favorite && favorite.base64) {
        imgEl.src = favorite.base64;
        imgEl.style.display = 'block';
        phEl.style.display = 'none';
      } else {
        imgEl.style.display = 'none';
        imgEl.removeAttribute('src');
        phEl.style.display = 'flex';
      }
    } catch {
      imgEl.style.display = 'none';
      phEl.style.display = 'flex';
    }
  }

  function openApp() {
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'myhub:open', id: 'qr-he' }, '*');
    } else {
      window.open('../index.html', '_blank');
    }
  }

  const el = document.getElementById('qw');
  el.addEventListener('click', openApp);
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openApp(); }
  });

  window.addEventListener('storage', (e) => { if (e.key === KEY) refresh(); });

  refresh();
  setInterval(refresh, 3000);

  if (window.lucide) lucide.createIcons();
  else setTimeout(() => window.lucide && lucide.createIcons(), 300);
</script>
