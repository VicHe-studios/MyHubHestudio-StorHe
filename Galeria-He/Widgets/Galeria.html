<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root {
    --text: #0b1220;
    --muted: #64748b;
    --field: #f6f8fb;
    --line: rgba(15, 23, 42, 0.08);
  }
  html[data-modo="oscuro"] {
    --text: #f4f4f6;
    --muted: #9ea1aa;
    --field: #2a2a31;
    --line: rgba(255, 255, 255, 0.09);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; width: 100vw;
    background: transparent; overflow: hidden; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  img {
    width: 100%; height: 100%; object-fit: cover;
    display: block; border-radius: 16px;
  }
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; color: var(--muted); gap: 8px;
    background: var(--field); border-radius: 16px; border: 1px dashed var(--line);
  }
  .empty-state svg { width: 32px; height: 32px; opacity: 0.5; }
  .empty-state span { font-size: 12px; font-weight: 600; }
</style>
</head>
<body>
  <img id="photo" src="" style="display: none;" alt="Última foto">
  <div class="empty-state" id="empty" style="display: none;">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
    <span>Galería vacía</span>
  </div>

<script>
  if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'myhub:tema:res') {
      document.documentElement.dataset.modo = e.data.modo;
      document.documentElement.style.setProperty('--accent', e.data.color);
    }
  });

  const STORAGE_KEY = 'myhub_galeria_imagenes'; // La misma llave que usa tu app
  const photoEl = document.getElementById('photo');
  const emptyEl = document.getElementById('empty');

  const loadImage = () => {
    try {
      const imagesData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      if (imagesData.length > 0) {
        // Ordenar por fecha para obtener la más reciente
        imagesData.sort((a, b) => b.date - a.date);
        photoEl.src = imagesData[0].base64;
        photoEl.style.display = 'block';
        emptyEl.style.display = 'none';
      } else {
        photoEl.style.display = 'none';
        emptyEl.style.display = 'flex';
      }
    } catch (e) {
      photoEl.style.display = 'none';
      emptyEl.style.display = 'flex';
    }
  };

  loadImage();
  // Escuchar cambios en localStorage (por si subes una foto desde la app)
  window.addEventListener('storage', (e) => {
    if (e.key === STORAGE_KEY) loadImage();
  });
  
  // Refrescar cada 5 segundos por si el evento storage falla en el iframe
  setInterval(loadImage, 5000);
</script>
</body>
</html>
