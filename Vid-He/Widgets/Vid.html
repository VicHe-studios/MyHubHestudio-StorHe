<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root {
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; width: 100vw;
    background: #000; overflow: hidden; border-radius: 16px;
    font-family: 'Segoe UI Variable', system-ui, sans-serif;
    color: #fff;
  }

  .widget {
    width: 100%; height: 100%; position: relative;
    display: flex; align-items: center; justify-content: center;
  }

  video {
    width: 100%; height: 100%; object-fit: cover;
    display: none;
  }
  video.on { display: block; }

  /* Estado vacío */
  .empty-state {
    position: absolute; inset: 0;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.4); gap: 8px;
    font-size: 11px; font-weight: 600;
  }
  .empty-state.show { display: flex; }
  .empty-state svg { width: 28px; height: 28px; opacity: 0.5; }

  /* Controles flotantes */
  .controls {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: space-between;
    padding: 0 12px; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,0.4), transparent 40%, transparent 60%, rgba(0,0,0,0.4));
    opacity: 0; transition: opacity 0.2s;
  }
  .controls.show { display: flex; }
  .widget:hover .controls, .controls.playing { opacity: 1; pointer-events: auto; }
  
  /* Si está reproduciendo, los controles se ocultan hasta que pasas el ratón */
  .widget:hover .controls.playing { opacity: 1; }
  .widget:not(:hover) .controls.playing { opacity: 0; }

  .btn {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: 0.15s;
  }
  .btn:hover { background: var(--accent); transform: scale(1.1); }
  .btn:disabled { opacity: 0; pointer-events: none; }
  .btn svg { width: 14px; height: 14px; }

  .btn-play {
    width: 36px; height: 36px; margin: 0 auto;
  }
  .btn-play svg { width: 18px; height: 18px; margin-left: 2px; }
  .btn-play.paused svg { margin-left: 0; }
</style>
</head>
<body>

  <div class="widget">
    <video id="video" playsinline preload="metadata"></video>

    <div class="empty-state" id="empty">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
      <span>Sin vídeos</span>
    </div>

    <div class="controls" id="controls">
      <button class="btn" id="btnPrev">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      
      <button class="btn btn-play" id="btnPlay">
        <svg xmlns="http://www.w3.org/2000/svg" id="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg xmlns="http://www.w3.org/2000/svg" id="icon-pause" style="display:none;" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>

      <button class="btn" id="btnNext">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

<script>
  if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'myhub:tema:res') {
      document.documentElement.style.setProperty('--accent', e.data.color);
    }
  });

  const NP_KEY = 'vid_he_nowplaying';
  const DB_NAME = 'vid_he_db';
  const DB_VERSION = 1;

  const videoEl = document.getElementById('video');
  const controlsEl = document.getElementById('controls');
  const btnPlay = document.getElementById('btnPlay');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const emptyEl = document.getElementById('empty');
  const iconPlay = document.getElementById('icon-play');
  const iconPause = document.getElementById('icon-pause');

  const state = { videos: [], currentIndex: -1, objectUrl: null, playing: false };
  let suppressWrite = false;

  function openDB() {
    return new Promise(res => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
    });
  }
  async function getVideos() {
    const db = await openDB();
    if (!db) return [];
    return new Promise(res => {
      const tx = db.transaction('videos', 'readonly');
      const r = tx.objectStore('videos').getAll();
      r.onsuccess = () => res(r.result || []);
    });
  }

  function writeNP() {
    if (suppressWrite) return;
    const v = state.videos[state.currentIndex];
    if (!v) { localStorage.removeItem(NP_KEY); return; }
    try {
      localStorage.setItem(NP_KEY, JSON.stringify({
        id: v.id, playing: state.playing,
        currentTime: videoEl.currentTime || 0,
        duration: videoEl.duration || v.duration || 0,
        ts: Date.now(), source: 'widget'
      }));
    } catch (e) {}
  }

  function updateUI() {
    const v = state.videos[state.currentIndex];
    if (!v) {
      videoEl.classList.remove('on');
      emptyEl.classList.add('show');
      controlsEl.classList.remove('show');
      return;
    }

    videoEl.classList.add('on');
    emptyEl.classList.remove('show');
    controlsEl.classList.add('show');

    btnPrev.disabled = state.currentIndex === 0;
    btnNext.disabled = state.currentIndex === state.videos.length - 1;
    
    // UI del botón Play/Pause
    btnPlay.classList.toggle('paused', !state.playing);
    iconPlay.style.display = state.playing ? 'none' : 'block';
    iconPause.style.display = state.playing ? 'block' : 'none';
    
    // Ocultar controles si está reproduciendo
    controlsEl.classList.toggle('playing', state.playing);
  }

  function loadVideo(index, autoplay = false) {
    if (index < 0 || index >= state.videos.length) return;
    if (state.objectUrl) { URL.revokeObjectURL(state.objectUrl); state.objectUrl = null; }

    state.currentIndex = index;
    const v = state.videos[index];
    state.objectUrl = URL.createObjectURL(v.blob);
    videoEl.src = state.objectUrl;
    state.playing = false;

    updateUI();
    writeNP();

    if (autoplay) {
      videoEl.play().catch(() => { state.playing = false; updateUI(); });
    }
  }

  // Eventos de control
  btnPlay.onclick = () => {
    if (state.currentIndex < 0) return;
    if (videoEl.paused) videoEl.play().catch(() => {});
    else videoEl.pause();
  };

  btnPrev.onclick = () => {
    if (state.currentIndex <= 0) return;
    loadVideo(state.currentIndex - 1, !videoEl.paused);
  };

  btnNext.onclick = () => {
    if (state.currentIndex >= state.videos.length - 1) return;
    loadVideo(state.currentIndex + 1, !videoEl.paused);
  };

  // Eventos del elemento video
  videoEl.addEventListener('play', () => { state.playing = true; updateUI(); writeNP(); });
  videoEl.addEventListener('pause', () => { state.playing = false; updateUI(); writeNP(); });
  videoEl.addEventListener('ended', () => {
    if (state.currentIndex < state.videos.length - 1) loadVideo(state.currentIndex + 1, true);
    else { state.playing = false; updateUI(); }
  });

  // Sincronización con la app
  window.addEventListener('storage', (e) => {
    if (e.key !== NP_KEY) return;
    try {
      const np = JSON.parse(e.newValue || '{}');
      if (np.source === 'app' && np.playing && !videoEl.paused) {
        suppressWrite = true;
        videoEl.pause();
        setTimeout(() => { suppressWrite = false; }, 60);
      }
    } catch (err) {}
  });

  async function init() {
    state.videos = await getVideos();
    state.videos.sort((a, b) => (a.date || 0) - (b.date || 0));

    if (state.videos.length === 0) { updateUI(); return; }

    let startIdx = state.videos.length - 1;
    let savedTime = 0;

    const raw = localStorage.getItem(NP_KEY);
    if (raw) {
      try {
        const np = JSON.parse(raw);
        const i = state.videos.findIndex(v => v.id === np.id);
        if (i >= 0) { startIdx = i; savedTime = np.currentTime || 0; }
      } catch (err) {}
    }

    loadVideo(startIdx, false);

    if (savedTime > 0) {
      const applyTime = () => {
        try { videoEl.currentTime = savedTime; } catch (e) {}
        videoEl.removeEventListener('loadedmetadata', applyTime);
      };
      if (videoEl.readyState >= 1) applyTime();
      else videoEl.addEventListener('loadedmetadata', applyTime);
    }
  }

  init();
</script>
</body>
</html>
