<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.15);
    --text: #0b1220;
    --muted: #64748b;
    --line: rgba(15, 23, 42, 0.08);
    --card: #ffffff;
    --field: #f6f8fb;
    --danger: #ef4444;
  }
  
  html[data-modo="oscuro"] {
    --text: #f4f4f6;
    --muted: #9ea1aa;
    --line: rgba(255, 255, 255, 0.09);
    --card: #222227;
    --field: #2a2a31;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: 'Segoe UI Variable', system-ui, sans-serif;
    background: var(--card); color: var(--text);
    overflow: hidden;
  }

  /* Login Box */
  .login-screen {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center;
  }
  .login-icon {
    width: 64px; height: 64px; border-radius: 16px; background: var(--accent-soft);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
  }
  .login-icon svg { width: 32px; height: 32px; }
  .login-screen h2 { margin: 0 0 8px; font-size: 20px; }
  .login-screen p { margin: 0 0 20px; font-size: 13px; color: var(--muted); }
  
  .login-form { width: 100%; max-width: 260px; display: flex; flex-direction: column; gap: 12px; }

  /* Principal */
  .main-screen { display: none; flex-direction: column; height: 100%; }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    background: var(--card); flex-shrink: 0;
  }
  .header h2 { margin: 0; font-size: 16px; font-weight: 700; }
  
  .btn-add {
    background: var(--accent); color: #fff; border: none; padding: 6px 12px;
    border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; transition: 0.2s;
  }
  .btn-add:hover { filter: brightness(1.1); }
  .btn-add svg { width: 14px; height: 14px; }

  .list-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }

  /* Tarjetas de contraseña */
  .pass-card {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    background: var(--field); border: 1px solid var(--line); border-radius: 12px;
    transition: border-color 0.2s;
  }
  .pass-card:hover { border-color: var(--accent-soft); }
  .pass-icon {
    width: 36px; height: 36px; border-radius: 8px; background: var(--card);
    display: flex; align-items: center; justify-content: center; color: var(--accent);
    border: 1px solid var(--line); flex-shrink: 0;
  }
  .pass-icon svg { width: 18px; height: 18px; }
  
  .pass-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .pass-site { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pass-user { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pass-pwd { font-family: monospace; font-size: 13px; letter-spacing: 1px; color: var(--muted); }
  
  .pass-actions { display: flex; gap: 4px; }
  .btn-icon {
    background: transparent; border: none; color: var(--muted); width: 28px; height: 28px;
    border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: 0.2s;
  }
  .btn-icon:hover { background: var(--line); color: var(--text); }
  .btn-icon.danger:hover { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
  .btn-icon svg { width: 14px; height: 14px; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--card); width: 90%; max-width: 320px; padding: 20px;
    border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: flex; flex-direction: column; gap: 12px;
  }
  .modal h3 { margin: 0 0 8px; font-size: 16px; }
  
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--field); color: var(--text); font-family: inherit; font-size: 13px; outline: none;
  }
  input:focus { border-color: var(--accent); }

  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .btn { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
  .btn.gray { background: var(--field); color: var(--text); border: 1px solid var(--line); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn:hover { filter: brightness(1.1); }

  .app-credit {
    text-align: center; font-size: 11px; color: var(--muted); padding: 8px;
    background: var(--card); border-top: 1px solid var(--line); flex-shrink: 0;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>

  <!-- Pantalla de Bloqueo -->
  <div class="login-screen" id="login-screen">
    <div class="login-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>
    <h2 id="login-title">Pass-He Bloqueado</h2>
    <p id="login-desc">Ingresa tu clave maestra para acceder.</p>
    <div class="login-form">
      <input type="password" id="master-pass" placeholder="Clave maestra...">
      <button class="btn primary" id="btn-unlock" style="padding: 10px;">Desbloquear</button>
    </div>
  </div>

  <!-- Pantalla Principal -->
  <div class="main-screen" id="main-screen">
    <div class="header">
      <h2>Mis Contraseñas</h2>
      <button class="btn-add" id="btn-new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Añadir
      </button>
    </div>
    <div class="list-container" id="list-container"></div>
  </div>

  <div class="app-credit">Hecho con ❤️ por VicHeStudios</div>

  <!-- Modal para agregar/editar -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modal-title">Nueva Contraseña</h3>
      <input type="text" id="inp-site" placeholder="Sitio o App (ej. GitHub)">
      <input type="text" id="inp-user" placeholder="Usuario o Correo">
      <input type="text" id="inp-pass" placeholder="Contraseña">
      <div class="modal-actions">
        <button class="btn gray" id="btn-cancel">Cancelar</button>
        <button class="btn primary" id="btn-save">Guardar</button>
      </div>
    </div>
  </div>

<script>
  // Sincronización de Tema
  if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'myhub:tema:res') {
      document.documentElement.dataset.modo = e.data.modo;
      document.documentElement.style.setProperty('--accent', e.data.color);
      document.documentElement.style.setProperty('--accent-soft', e.data.color + '26');
    }
  });

  // Utilidades de cifrado muy básico (Base64 + Invertido) para no guardar texto plano
  const encode = (str) => btoa(str.split('').reverse().join(''));
  const decode = (str) => atob(str).split('').reverse().join('');

  let masterKey = '';
  let passwords = [];
  let editIndex = -1;

  const loginScreen = document.getElementById('login-screen');
  const mainScreen = document.getElementById('main-screen');
  const masterPassInput = document.getElementById('master-pass');
  const loginTitle = document.getElementById('login-title');
  const loginDesc = document.getElementById('login-desc');

  const storedKey = localStorage.getItem('myhub_passkey');

  if (!storedKey) {
    loginTitle.textContent = 'Crea tu Clave Maestra';
    loginDesc.textContent = 'Se usará para proteger tus contraseñas.';
  }

  // Desbloqueo
  document.getElementById('btn-unlock').onclick = () => {
    const val = masterPassInput.value;
    if (!val) return;

    if (!storedKey) {
      // Primera vez
      localStorage.setItem('myhub_passkey', encode(val));
      masterKey = val;
      unlock();
    } else {
      // Ya existe
      if (encode(val) === storedKey) {
        masterKey = val;
        unlock();
      } else {
        alert('Clave incorrecta');
      }
    }
  };

  const unlock = () => {
    loginScreen.style.display = 'none';
    mainScreen.style.display = 'flex';
    loadData();
  };

  // Lógica de datos
  const loadData = () => {
    const raw = localStorage.getItem('myhub_passwords');
    if (raw) {
      try {
        const parsed = JSON.parse(decode(raw));
        passwords = parsed;
      } catch(e) { passwords = []; }
    }
    renderList();
  };

  const saveData = () => {
    localStorage.setItem('myhub_passwords', encode(JSON.stringify(passwords)));
    renderList();
  };

  const renderList = () => {
    const list = document.getElementById('list-container');
    list.innerHTML = '';
    
    if (passwords.length === 0) {
      list.innerHTML = `<p style="text-align:center; color:var(--muted); font-size:13px; margin-top:20px;">No hay contraseñas guardadas.</p>`;
      return;
    }

    passwords.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'pass-card';
      card.innerHTML = `
        <div class="pass-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>
        <div class="pass-info">
          <span class="pass-site">${p.site}</span>
          <span class="pass-user">${p.user}</span>
          <span class="pass-pwd" id="pwd-${i}">••••••••</span>
        </div>
        <div class="pass-actions">
          <button class="btn-icon" onclick="togglePwd(${i})" title="Mostrar/Ocultar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
          <button class="btn-icon" onclick="copyPwd(${i})" title="Copiar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
          <button class="btn-icon" onclick="editPwd(${i})" title="Editar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          </button>
          <button class="btn-icon danger" onclick="deletePwd(${i})" title="Eliminar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        </div>
      `;
      list.appendChild(card);
    });
  };

  // Acciones globales
  window.togglePwd = (i) => {
    const el = document.getElementById(`pwd-${i}`);
    if (el.textContent === '••••••••') el.textContent = passwords[i].pass;
    else el.textContent = '••••••••';
  };

  window.copyPwd = (i) => {
    navigator.clipboard.writeText(passwords[i].pass);
    alert('Contraseña copiada al portapapeles');
  };

  window.deletePwd = (i) => {
    if (confirm('¿Eliminar esta contraseña?')) {
      passwords.splice(i, 1);
      saveData();
    }
  };

  window.editPwd = (i) => {
    editIndex = i;
    document.getElementById('modal-title').textContent = 'Editar Contraseña';
    document.getElementById('inp-site').value = passwords[i].site;
    document.getElementById('inp-user').value = passwords[i].user;
    document.getElementById('inp-pass').value = passwords[i].pass;
    document.getElementById('modal').classList.add('active');
  };

  // Modal
  const modal = document.getElementById('modal');
  document.getElementById('btn-new').onclick = () => {
    editIndex = -1;
    document.getElementById('modal-title').textContent = 'Nueva Contraseña';
    document.getElementById('inp-site').value = '';
    document.getElementById('inp-user').value = '';
    document.getElementById('inp-pass').value = '';
    modal.classList.add('active');
  };

  document.getElementById('btn-cancel').onclick = () => modal.classList.remove('active');

  document.getElementById('btn-save').onclick = () => {
    const site = document.getElementById('inp-site').value.trim();
    const user = document.getElementById('inp-user').value.trim();
    const pass = document.getElementById('inp-pass').value;

    if (!site || !user || !pass) return alert('Rellena todos los campos');

    if (editIndex > -1) {
      passwords[editIndex] = { site, user, pass };
    } else {
      passwords.push({ site, user, pass });
    }
    
    saveData();
    modal.classList.remove('active');
  };
</script>
</body>
</html>
