<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.15);
    --text: #0b1220;
    --muted: #64748b;
    --line: rgba(15, 23, 42, 0.08);
    --card: #ffffff;
    --field: #f6f8fb;
    --sidebar-bg: #f1f5f9;
    --editor-bg: #1e1e1e;
    --sidebar-width: 220px;
  }
  
  html[data-modo="oscuro"] {
    --text: #f4f4f6;
    --muted: #9ea1aa;
    --line: rgba(255, 255, 255, 0.09);
    --card: #222227;
    --field: #2a2a31;
    --sidebar-bg: #1e1e1e;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: 'Segoe UI Variable', system-ui, sans-serif;
    background: var(--card); color: var(--text);
    overflow: hidden;
  }

  /* ===== TOPBAR ===== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; border-bottom: 1px solid var(--line);
    background: var(--card); flex-shrink: 0; z-index: 10;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topbar-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .topbar-title svg { color: var(--accent); width: 18px; height: 18px; }

  .btn-toggle-sidebar {
    background: transparent; border: none; color: var(--muted); cursor: pointer;
    width: 32px; height: 32px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, color 0.2s; flex-shrink: 0;
  }
  .btn-toggle-sidebar:hover { background: var(--field); color: var(--text); }
  .btn-toggle-sidebar svg { width: 18px; height: 18px; }

  .btn-export {
    background: var(--accent); color: #fff; border: none; padding: 6px 14px;
    border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; transition: 0.2s;
  }
  .btn-export:hover { filter: brightness(1.1); }
  .btn-export svg { width: 14px; height: 14px; }

  .main-layout { display: flex; flex: 1; overflow: hidden; min-height: 0; }

  .sidebar {
    width: var(--sidebar-width);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; flex-shrink: 0;
    background: var(--sidebar-bg); color: var(--text);
    overflow: hidden;
    transition: width 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.15);
  }
  .sidebar.collapsed {
    width: 0;
    border-right-width: 0;
  }
  .sidebar-inner {
    width: var(--sidebar-width);
    display: flex; flex-direction: column; height: 100%;
    flex-shrink: 0;
  }
  
  .sidebar-header {
    padding: 10px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); display: flex; justify-content: space-between; align-items: center;
  }
  .sidebar-actions { display: flex; gap: 4px; }
  .btn-icon {
    background: transparent; border: none; color: var(--muted); cursor: pointer;
    width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
  }
  .btn-icon:hover { background: var(--line); color: var(--text); }
  .btn-icon svg { width: 14px; height: 14px; }

  .file-tree { flex: 1; overflow-y: auto; padding: 4px 0; font-size: 13px; }

  .tree-item {
    display: flex; align-items: center; gap: 6px; padding: 4px 12px;
    cursor: pointer; color: var(--text); user-select: none;
  }
  .tree-item:hover { background: var(--line); }
  .tree-item.active { background: var(--accent-soft); color: var(--accent); }
  .tree-item.folder-active { background: var(--line); color: var(--accent); }
  
  .tree-item svg { width: 14px; height: 14px; flex-shrink: 0; }
  .tree-item .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree-item .actions { display: none; gap: 2px; }
  .tree-item:hover .actions { display: flex; }
  .tree-item .actions button { background: transparent; border: none; padding: 2px; color: var(--muted); cursor: pointer; border-radius: 4px; }
  .tree-item .actions button:hover { color: var(--text); background: rgba(0,0,0,0.1); }
  .tree-item .actions svg { width: 12px; height: 12px; }

  .editor-area {
    flex: 1; display: flex; flex-direction: column; background: var(--editor-bg);
    position: relative; min-width: 0;
  }
  
  #editor-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

  .statusbar {
    height: 24px; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; font-size: 11px; font-weight: 500; flex-shrink: 0;
  }
  .status-left, .status-right { display: flex; gap: 16px; align-items: center; }

  .empty-state {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #666;
    font-size: 14px; gap: 10px; pointer-events: none; text-align: center; padding: 20px;
  }
  .empty-state svg { width: 48px; height: 48px; opacity: 0.5; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 9999;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--card); width: 90%; max-width: 300px; padding: 20px;
    border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; gap: 12px; color: var(--text);
  }
  .modal h3 { margin: 0; font-size: 16px; }
  .modal input, .modal select {
    padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--field); color: var(--text); font-family: inherit; font-size: 13px; outline: none;
  }
  .modal input:focus, .modal select:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .btn { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
  .btn.gray { background: var(--field); color: var(--text); border: 1px solid var(--line); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn:hover { filter: brightness(1.1); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.3); border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .sidebar { transition-duration: 0.01ms; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" title="Mostrar/Ocultar explorador">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>
      <div class="topbar-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        Cod-He
      </div>
    </div>
    <button class="btn-export" id="btn-export">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      Exportar ZIP
    </button>
  </div>

  <div class="main-layout">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-header">
          Explorador
          <div class="sidebar-actions">
            <button class="btn-icon" id="btn-new-file" title="Nuevo Archivo (se crea en la carpeta seleccionada)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
            </button>
            <button class="btn-icon" id="btn-new-folder" title="Nueva Carpeta">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
            </button>
          </div>
        </div>
        <div class="file-tree" id="file-tree"></div>
      </div>
    </div>

    <div class="editor-area">
      <div id="editor-container"></div>
      <div class="empty-state" id="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
        <span>Selecciona o crea un archivo<br>para empezar</span>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <div class="status-left">
      <span id="status-file">Sin archivo</span>
    </div>
    <div class="status-right">
      <span id="status-lang">Texto plano</span>
      <span id="status-pos">Ln 1, Col 1</span>
      <span style="opacity: 0.8; border-left: 1px solid rgba(255,255,255,0.3); padding-left: 16px; display: flex; gap: 4px;">
        Motor: <a href="https://ace.c9.io/" target="_blank" style="color: #fff; text-decoration: underline; font-weight: 600;">Ace</a> • 
        ZIP: <a href="https://stuk.github.io/jszip/" target="_blank" style="color: #fff; text-decoration: underline; font-weight: 600;">JSZip</a>
      </span>
    </div>
  </div>

  <div class="modal-overlay" id="modal-prompt">
    <div class="modal">
      <h3 id="modal-title">Nuevo Archivo</h3>
      <input type="text" id="modal-input" placeholder="Nombre...">
      <div class="modal-actions">
        <button class="btn gray" onclick="document.getElementById('modal-prompt').classList.remove('active')">Cancelar</button>
        <button class="btn primary" id="btn-prompt-save">Aceptar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-move">
    <div class="modal">
      <h3>Mover Archivo</h3>
      <select id="move-select"></select>
      <div class="modal-actions">
        <button class="btn gray" onclick="document.getElementById('modal-move').classList.remove('active')">Cancelar</button>
        <button class="btn primary" id="btn-move-save">Mover</button>
      </div>
    </div>
  </div>

<script>
  if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'myhub:tema:res') {
      document.documentElement.dataset.modo = e.data.modo;
      document.documentElement.style.setProperty('--accent', e.data.color);
      document.documentElement.style.setProperty('--accent-soft', e.data.color + '26');
    }
  });

  const editor = ace.edit("editor-container");
  editor.setTheme("ace/theme/tomorrow_night");
  editor.session.setMode("ace/mode/text");
  editor.setOptions({
    fontSize: "14px",
    fontFamily: "Consolas, 'Courier New', monospace",
    showPrintMargin: false,
    enableBasicAutocompletion: true,
    enableLiveAutocompletion: true
  });
  editor.setReadOnly(true); 

  window.addEventListener('resize', () => editor.resize());

  editor.session.selection.on('changeCursor', () => {
    const pos = editor.getCursorPosition();
    document.getElementById('status-pos').textContent = `Ln ${pos.row + 1}, Col ${pos.column + 1}`;
  });

  let files = [];
  let activeFileId = null;
  let activeFolderId = 'root';

  try {
    // Cambiado a v4 para forzar la recarga del ejemplo limpio
    const stored = localStorage.getItem('codhe_files_v4');
    if (stored) files = JSON.parse(stored);
  } catch(e) { files = []; }

  if (!Array.isArray(files) || files.length === 0 || !files.find(f => f.id === 'root')) {
    files = [
      { id: 'root', parent: null, name: 'Mi Proyecto', type: 'folder' },
      { 
        id: 'f1', parent: 'root', name: 'index.html', type: 'file', 
        content: `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    /* Regla de oro de MyHub */
    html, body { height: 100vh; width: 100%; margin: 0; overflow: hidden; }
    body { 
      background: var(--card); 
      color: var(--text); 
      font-family: sans-serif;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <h1>¡Hola MyHub!</h1>
  <p>Tu app está lista para despegar.</p>
  <p style="font-size:12px; color:var(--muted); margin-top:8px;">
    Este proyecto incluye un widget de ejemplo en <code>widgets/reloj.html</code>
  </p>
</body>
</html>` 
      },
      { 
        id: 'f2', parent: 'root', name: 'manifest.json', type: 'file', 
        content: `{
  "id": "mi-app",
  "titulo": "Mi App",
  "icono": "box",
  "main": "index.html",
  "autor": "Tu Nombre",
  "descripcion": "Una app increíble con widget de ejemplo",
  "widgets": [
    { "file": "widgets/reloj.html", "size": "2x1" }
  ]
}` 
      },
      { id: 'fw', parent: 'root', name: 'widgets', type: 'folder' },
      {
        id: 'f3', parent: 'fw', name: 'reloj.html', type: 'file',
        content: `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  /* === ADN MyHub: variables de color y modo oscuro === */
  :root {
    --accent: #2563eb;
    --text: #0b1220;
    --muted: #64748b;
  }
  html[data-modo="oscuro"] {
    --text: #f4f4f6;
    --muted: #9ea1aa;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100vh; width: 100%; margin: 0; overflow: hidden;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    background: transparent; /* el lobby ya aplica el efecto glass */
    padding: 12px;
  }

  .hora {
    font-size: 42px; font-weight: 700;
    letter-spacing: -0.03em; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .fecha {
    font-size: 12px; color: var(--muted);
    margin-top: 6px; text-transform: capitalize;
    text-align: center; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .barra {
    width: 32px; height: 3px; background: var(--accent);
    border-radius: 2px; margin-top: 10px;
  }
</style>
</head>
<body>
  <div class="hora" id="hora">--:--</div>
  <div class="fecha" id="fecha">Cargando…</div>
  <div class="barra"></div>

<script>
  // === Sincronización de tema (obligatorio en MyHub) ===
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
  }
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'myhub:tema:res') {
      document.documentElement.dataset.modo = e.data.modo;
      document.documentElement.style.setProperty('--accent', e.data.color);
    }
  });

  // === Reloj ===
  const actualizar = () => {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('hora').textContent = hh + ':' + mm;
    document.getElementById('fecha').textContent =
      now.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
  };
  actualizar();
  setInterval(actualizar, 1000);
<\/script>
</body>
</html>`
      }
    ];
  }

  const fileTreeEl = document.getElementById('file-tree');
  const emptyState = document.getElementById('empty-state');
  const statusFile = document.getElementById('status-file');
  const statusLang = document.getElementById('status-lang');
  const sidebarEl = document.getElementById('sidebar');

  // Cambiado a v4
  const saveToStorage = () => localStorage.setItem('codhe_files_v4', JSON.stringify(files));

  const getLanguage = (filename) => {
    if (!filename) return 'text';
    if (filename.endsWith('.html')) return 'html';
    if (filename.endsWith('.css')) return 'css';
    if (filename.endsWith('.js')) return 'javascript';
    if (filename.endsWith('.json')) return 'json';
    if (filename.endsWith('.md')) return 'markdown';
    if (filename.endsWith('.py')) return 'python';
    return 'text';
  };

  const renderTree = () => {
    fileTreeEl.innerHTML = '';
    
    const sortedFiles = [...files].sort((a, b) => {
      if (a.type === b.type) return a.name.localeCompare(b.name);
      return a.type === 'folder' ? -1 : 1;
    });

    const buildTree = (parentId, depth) => {
      const children = sortedFiles.filter(f => f.parent === parentId);
      
      children.forEach(child => {
        const div = document.createElement('div');
        const isFolder = child.type === 'folder';
        
        let className = 'tree-item';
        if (activeFileId === child.id && !isFolder) className += ' active';
        if (activeFolderId === child.id && isFolder) className += ' folder-active';
        div.className = className;

        div.style.paddingLeft = `${12 + (depth * 12)}px`;
        
        const icon = isFolder 
          ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`
          : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`;

        let moveBtn = isFolder ? '' : `<button onclick="moveItem(event, '${child.id}')" title="Mover a carpeta..."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><polyline points="12 11 12 17"></polyline><polyline points="9 14 12 11 15 14"></polyline></svg></button>`;

        div.innerHTML = `
          ${icon}
          <span class="name">${child.name}</span>
          <div class="actions">
            ${moveBtn}
            <button onclick="renameItem(event, '${child.id}')" title="Renombrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
            <button onclick="deleteItem(event, '${child.id}')" title="Eliminar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
          </div>
        `;

        div.onclick = (e) => {
          if (e.target.closest('.actions')) return;
          if (isFolder) {
            activeFolderId = child.id;
            renderTree();
          } else {
            activeFolderId = child.parent;
            openFile(child.id);
          }
        };

        fileTreeEl.appendChild(div);
        if (isFolder) buildTree(child.id, depth + 1);
      });
    };

    buildTree('root', 0);
  };

  const openFile = (id) => {
    const file = files.find(f => f.id === id);
    if (!file || file.type === 'folder') return;

    activeFileId = id;
    renderTree();
    
    emptyState.style.display = 'none';
    editor.setReadOnly(false);
    editor.setValue(file.content || '', -1);
    editor.session.setMode(`ace/mode/${getLanguage(file.name)}`);
    editor.resize(); 
    editor.focus();
    
    statusFile.textContent = file.name;
    statusLang.textContent = getLanguage(file.name).toUpperCase();
  };

  editor.session.on('change', () => {
    if (!activeFileId) return;
    const file = files.find(f => f.id === activeFileId);
    if (file) {
      file.content = editor.getValue();
      saveToStorage();
    }
  });

  const generateId = () => Math.random().toString(36).substr(2, 9);

  document.getElementById('btn-toggle-sidebar').onclick = () => {
    sidebarEl.classList.toggle('collapsed');
    setTimeout(() => editor.resize(), 320);
  };

  const modalPrompt = document.getElementById('modal-prompt');
  const modalTitle = document.getElementById('modal-title');
  const modalInput = document.getElementById('modal-input');
  let promptCallback = null;

  const showPrompt = (title, defaultValue, callback, placeholder = '') => {
    modalTitle.textContent = title;
    modalInput.value = defaultValue;
    modalInput.placeholder = placeholder || 'Nombre...';
    promptCallback = callback;
    modalPrompt.classList.add('active');
    setTimeout(() => modalInput.focus(), 50);
  };

  document.getElementById('btn-prompt-save').onclick = () => {
    if (promptCallback) promptCallback(modalInput.value.trim());
    modalPrompt.classList.remove('active');
  };

  modalInput.onkeydown = (e) => {
    if (e.key === 'Enter') document.getElementById('btn-prompt-save').click();
  };

  const modalMove = document.getElementById('modal-move');
  const moveSelect = document.getElementById('move-select');
  let moveFileId = null;

  window.moveItem = (e, id) => {
    e.stopPropagation();
    moveFileId = id;
    
    moveSelect.innerHTML = '';
    const folders = files.filter(f => f.type === 'folder');
    
    folders.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f.id;
      opt.textContent = f.id === 'root' ? '/ (Raíz)' : f.name;
      moveSelect.appendChild(opt);
    });

    const currentFile = files.find(f => f.id === id);
    if (currentFile) moveSelect.value = currentFile.parent;

    modalMove.classList.add('active');
  };

  document.getElementById('btn-move-save').onclick = () => {
    if (moveFileId) {
      const file = files.find(f => f.id === moveFileId);
      if (file) {
        file.parent = moveSelect.value;
        saveToStorage();
        renderTree();
      }
    }
    modalMove.classList.remove('active');
  };

  document.getElementById('btn-new-file').onclick = () => {
    showPrompt('Nuevo Archivo', 'archivo.txt', (name) => {
      if (!name) return;
      const newId = generateId();
      files.push({ id: newId, parent: activeFolderId, name, type: 'file', content: '' });
      saveToStorage();
      renderTree();
      openFile(newId);
    });
  };

  document.getElementById('btn-new-folder').onclick = () => {
    showPrompt('Nueva Carpeta', 'nueva_carpeta', (name) => {
      if (!name) return;
      files.push({ id: generateId(), parent: 'root', name, type: 'folder' });
      saveToStorage();
      renderTree();
    });
  };

  window.renameItem = (e, id) => {
    e.stopPropagation();
    const file = files.find(f => f.id === id);
    showPrompt('Renombrar', file.name, (newName) => {
      if (newName && newName !== file.name) {
        file.name = newName;
        saveToStorage();
        renderTree();
        if (activeFileId === id) {
          statusFile.textContent = newName;
          editor.session.setMode(`ace/mode/${getLanguage(newName)}`);
          statusLang.textContent = getLanguage(newName).toUpperCase();
        }
      }
    });
  };

  window.deleteItem = (e, id) => {
    e.stopPropagation();
    if (!confirm('¿Eliminar este elemento?')) return;
    
    const deleteRecursive = (targetId) => {
      const children = files.filter(f => f.parent === targetId);
      children.forEach(c => deleteRecursive(c.id));
      files = files.filter(f => f.id !== targetId);
    };
    
    deleteRecursive(id);
    saveToStorage();
    
    if (activeFileId === id) {
      activeFileId = null;
      editor.setValue('');
      editor.setReadOnly(true);
      emptyState.style.display = 'flex';
      statusFile.textContent = 'Sin archivo';
      statusLang.textContent = 'Texto plano';
    }
    if (activeFolderId === id) {
      activeFolderId = 'root';
    }
    renderTree();
  };

  document.getElementById('btn-export').onclick = () => {
    if (files.length <= 1) return alert('No hay archivos para exportar.');

    showPrompt(
      'Exportar Proyecto',
      '',
      async (customName) => {
        const zip = new JSZip();

        const getFullPath = (fileId) => {
          let path = [];
          let current = files.find(f => f.id === fileId);
          while (current && current.id !== 'root') {
            path.unshift(current.name);
            current = files.find(f => f.id === current.parent);
          }
          return path.join('/');
        };

        files.forEach(f => {
          if (f.type === 'file') zip.file(getFullPath(f.id), f.content || '');
        });

        try {
          const blob = await zip.generateAsync({ type: 'blob' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;

          const baseName = (customName && customName.trim()) ? customName.trim() : `CodHe_Project_${Date.now()}`;
          a.download = baseName.toLowerCase().endsWith('.zip') ? baseName : `${baseName}.zip`;

          a.click();
          URL.revokeObjectURL(url);
        } catch (e) {
          alert('Error al generar el ZIP');
        }
      },
      'Opcional — vacío = nombre automático'
    );
  };

  renderTree();
</script>
</body>
</html>
