<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.15);
    --text: #0b1220;
    --muted: #64748b;
    --line: rgba(15, 23, 42, 0.08);
    --card: #ffffff;
    --field: #f6f8fb;
    --danger: #ef4444;
    --sidebar-width: 150px;
  }
  html[data-modo="oscuro"] {
    --text: #f4f4f6;
    --muted: #9ea1aa;
    --line: rgba(255, 255, 255, 0.09);
    --card: #222227;
    --field: #2a2a31;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: row;
    font-family: 'Segoe UI Variable', system-ui, sans-serif;
    background: var(--card); color: var(--text); overflow: hidden;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: var(--sidebar-width); background: var(--field); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; flex-shrink: 0; 
    transition: width 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.15);
    overflow: hidden;
  }
  .sidebar.collapsed { width: 0; border-right-width: 0; }
  .sidebar-inner { width: var(--sidebar-width); display: flex; flex-direction: column; height: 100%; }

  .sidebar-header {
    padding: 12px 10px; border-bottom: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 8px;
  }
  .btn-new {
    background: var(--accent); color: #fff; border: none;
    padding: 8px; border-radius: 8px; font-weight: 600; font-size: 12px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: filter 0.2s; white-space: nowrap;
  }
  .btn-new:hover { filter: brightness(1.1); }
  .btn-new svg { width: 14px; height: 14px; }

  .chat-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .chat-item {
    padding: 8px; border-radius: 6px; font-size: 12px; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    color: var(--text); transition: background 0.15s;
  }
  .chat-item:hover { background: var(--line); }
  .chat-item.active { background: var(--accent-soft); color: var(--accent); }
  .chat-item .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-actions { display: none; gap: 4px; }
  .chat-item:hover .chat-actions, .chat-item.active .chat-actions { display: flex; }
  .btn-icon-sm {
    background: transparent; border: none; color: var(--muted); cursor: pointer;
    padding: 2px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
  }
  .btn-icon-sm:hover { color: var(--text); background: rgba(0,0,0,0.1); }
  .btn-icon-sm svg { width: 12px; height: 12px; }

  .sidebar-footer { padding: 10px; border-top: 1px solid var(--line); }
  .btn-settings {
    width: 100%; background: transparent; border: 1px solid var(--line); color: var(--text);
    padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: 0.2s; white-space: nowrap;
  }
  .btn-settings:hover { background: var(--card); border-color: var(--accent); }
  .btn-settings svg { width: 14px; height: 14px; }

  /* Créditos */
  .app-credit {
    text-align: center; font-size: 10px; color: var(--muted); margin-top: 10px;
  }
  .app-credit a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .app-credit a:hover { text-decoration: underline; }

  /* ===== CHAT AREA ===== */
  .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  
  .chat-header {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); flex-shrink: 0; gap: 10px;
  }
  .chat-header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .btn-toggle {
    background: transparent; border: none; color: var(--muted); cursor: pointer;
    padding: 4px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    transition: 0.2s;
  }
  .btn-toggle:hover { background: var(--field); color: var(--text); }
  .btn-toggle svg { width: 20px; height: 20px; }
  .chat-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .messages {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }

  /* ===== GLOBOS DE TEXTO ===== */
  .msg-container { display: flex; gap: 8px; max-width: 90%; animation: fadeIn 0.2s ease-out; }
  .msg-container.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-container.ai { align-self: flex-start; }

  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); color: var(--accent);
    margin-top: 4px;
  }
  .msg-avatar svg { width: 16px; height: 16px; }

  .msg {
    padding: 10px 14px; border-radius: 12px;
    font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    position: relative;
  }
  .msg.user {
    background: var(--accent); color: #fff; border-top-right-radius: 2px;
  }
  .msg.ai {
    background: var(--field); color: var(--text); border: 1px solid var(--line); border-top-left-radius: 2px;
  }
  .msg.error {
    align-self: center; background: rgba(239, 68, 68, 0.1); color: var(--danger);
    border: 1px solid var(--danger); text-align: center; font-size: 12px; border-radius: 12px; padding: 8px 12px;
  }

  /* Animación de escribiendo */
  .typing-container { display: flex; gap: 8px; align-self: flex-start; }
  .typing { display: flex; gap: 4px; align-items: center; padding: 12px 16px; background: var(--field); border: 1px solid var(--line); border-radius: 12px; border-top-left-radius: 2px; }
  .typing span { width: 6px; height: 6px; background: var(--muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
  .typing span:nth-child(1) { animation-delay: -0.32s; }
  .typing span:nth-child(2) { animation-delay: -0.16s; }

  /* ===== INPUT ===== */
  .input-area {
    padding: 12px 16px; border-top: 1px solid var(--line);
    background: var(--card); display: flex; gap: 8px; align-items: flex-end;
  }
  .input-box {
    flex: 1; padding: 10px 12px; border-radius: 10px;
    border: 1.5px solid var(--line); background: var(--field); color: var(--text);
    font-family: inherit; font-size: 13px; outline: none; resize: none;
    height: 44px; /* Altura fija para 1 línea perfecta */
    min-height: 44px;
    max-height: 120px;
    line-height: 20px; transition: border-color 0.2s; overflow-y: hidden;
  }
  .input-box:focus { border-color: var(--accent); }
  
  .btn-send {
    background: var(--accent); color: #fff; border: none;
    width: 44px; height: 44px; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: 0.2s;
  }
  .btn-send:hover { filter: brightness(1.1); transform: scale(1.05); }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-send svg { width: 18px; height: 18px; }

  /* ===== MODALES ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--card); width: 90%; max-width: 340px; padding: 20px;
    border-radius: 16px; border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: flex; flex-direction: column; gap: 14px;
  }
  .modal h3 { margin: 0; font-size: 16px; font-weight: 700; }
  
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .input-group input, .input-group select {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--field); color: var(--text);
    font-family: inherit; font-size: 13px; outline: none;
  }
  .input-group input:focus, .input-group select:focus { border-color: var(--accent); }
  
  .input-with-btn { display: flex; gap: 8px; }
  .input-with-btn input { flex: 1; }
  .btn-bulb {
    background: var(--field); border: 1px solid var(--line); color: var(--accent);
    width: 38px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: 0.2s; flex-shrink: 0;
  }
  .btn-bulb:hover { background: var(--accent-soft); border-color: var(--accent); }
  .btn-bulb svg { width: 18px; height: 18px; }

  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .btn { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
  .btn.gray { background: var(--field); color: var(--text); border: 1px solid var(--line); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn:hover { filter: brightness(1.1); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
</style>
</head>
<body>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-header">
        <button class="btn-new" id="btn-new-chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Nuevo Chat
        </button>
      </div>
      <div class="chat-list" id="chat-list"></div>
      <div class="sidebar-footer">
        <button class="btn-settings" id="btn-open-settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Ajustes
        </button>
        <!-- Créditos sutiles -->
        <div class="app-credit">
          Motor IA por <a href="https://openrouter.ai" target="_blank">OpenRouter</a>
        </div>
      </div>
    </div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area">
    <div class="chat-header">
      <div class="chat-header-left">
        <button class="btn-toggle" id="btn-toggle-sidebar" title="Ocultar/Mostrar menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="chat-title" id="chat-title">Selecciona o crea un chat</div>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <!-- Altura ajustada para no cortar el texto -->
      <textarea class="input-box" id="input-box" placeholder="Escribe..." rows="1"></textarea>
      <button class="btn-send" id="btn-send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>

  <!-- MODAL: AJUSTES -->
  <div class="modal-overlay" id="modal-settings">
    <div class="modal">
      <h3>Ajustes de IA</h3>
      <div class="input-group">
        <label>API Token (OpenRouter)</label>
        <input type="password" id="inp-token" placeholder="sk-or-v1-...">
      </div>
      
      <div class="input-group">
        <label>Modelo de IA</label>
        <div class="input-with-btn">
          <input type="text" id="inp-model" placeholder="Ej: openai/gpt-4o-mini">
          <button class="btn-bulb" id="btn-random-model" title="Probar modelo gratis al azar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1.45.62 2.84 1.5 3.5.76.76 1.23 1.52 1.41 2.5"></path></svg>
          </button>
        </div>
      </div>

      <div class="input-group">
        <label>Tu Nombre</label>
        <input type="text" id="inp-name" placeholder="Ej: Víctor">
      </div>
      <div class="input-group">
        <label>Longitud de respuestas</label>
        <select id="sel-length">
          <option value="short">Cortas (1-2 frases)</option>
          <option value="medium" selected>Medias (Párrafo conciso)</option>
          <option value="long">Largas (Explicación detallada)</option>
          <option value="detailed">Muy detalladas (Análisis profundo)</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn gray" id="btn-cancel-settings">Cancelar</button>
        <button class="btn primary" id="btn-save-settings">Guardar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: RENOMBRAR -->
  <div class="modal-overlay" id="modal-rename">
    <div class="modal">
      <h3>Renombrar Chat</h3>
      <div class="input-group">
        <input type="text" id="inp-rename" placeholder="Nuevo nombre...">
      </div>
      <div class="modal-actions">
        <button class="btn gray" id="btn-cancel-rename">Cancelar</button>
        <button class="btn primary" id="btn-save-rename">Guardar</button>
      </div>
    </div>
  </div>

<script>
  // 1. Sincronización de Tema
  if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'myhub:tema:res') {
      document.documentElement.dataset.modo = e.data.modo;
      document.documentElement.style.setProperty('--accent', e.data.color);
      document.documentElement.style.setProperty('--accent-soft', e.data.color + '26');
    }
  });

  // 2. Obtener Perfil de MyHub
  if (window.parent !== window) window.parent.postMessage({ type: 'myhub:perfil' }, '*');
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'myhub:perfil:res') {
      const perfil = e.data.data;
      const configRaw = localStorage.getItem('myhub_he_nteligence_config');
      if (!configRaw && perfil && perfil.nombre) {
        const nombreCompleto = `${perfil.nombre} ${perfil.apellido || ''}`.trim();
        config.name = nombreCompleto;
        document.getElementById('inp-name').value = nombreCompleto;
        saveConfig();
      }
    }
  });

  // 3. Estado Global
  let config = JSON.parse(localStorage.getItem('myhub_he_nteligence_config') || '{}');
  if (!config.token) config.token = '';
  if (!config.model) config.model = 'openai/gpt-4o-mini';
  if (!config.name) config.name = 'Usuario';
  if (!config.length) config.length = 'medium';

  let chats = JSON.parse(localStorage.getItem('myhub_he_nteligence_chats') || '[]');
  let activeChatId = localStorage.getItem('myhub_he_nteligence_active') || null;
  let isGenerating = false;

  // 4. Elementos DOM
  const sidebarEl = document.getElementById('sidebar');
  const chatListEl = document.getElementById('chat-list');
  const messagesEl = document.getElementById('messages');
  const inputBox = document.getElementById('input-box');
  const btnSend = document.getElementById('btn-send');
  const chatTitle = document.getElementById('chat-title');
  
  const modalSettings = document.getElementById('modal-settings');
  const modalRename = document.getElementById('modal-rename');
  let renamingChatId = null;

  // 5. Lógica de Configuración
  const saveConfig = () => {
    localStorage.setItem('myhub_he_nteligence_config', JSON.stringify(config));
  };

  const getSystemPrompt = () => {
    const lengths = {
      short: 'Responde de forma muy breve y directa, en 1 o 2 frases máximo.',
      medium: 'Responde con un párrafo conciso y bien estructurado.',
      long: 'Proporciona una explicación detallada y completa.',
      detailed: 'Proporciona un análisis muy profundo, exhaustivo y con ejemplos si es necesario.'
    };
    return `Eres He-nteligens, un asistente de IA útil e inteligente. El usuario se llama ${config.name}. ${lengths[config.length]}`;
  };

  // 6. Lógica de Chats
  const saveChats = () => {
    localStorage.setItem('myhub_he_nteligence_chats', JSON.stringify(chats));
    if (activeChatId) localStorage.setItem('myhub_he_nteligence_active', activeChatId);
  };

  const getActiveChat = () => chats.find(c => c.id === activeChatId);

  const createChat = () => {
    const newChat = {
      id: 'chat_' + Date.now(),
      title: 'Nuevo Chat',
      messages: []
    };
    chats.unshift(newChat);
    activeChatId = newChat.id;
    saveChats();
    renderSidebar();
    renderMessages();
    inputBox.focus();
  };

  const deleteChat = (id, e) => {
    e.stopPropagation();
    if (!confirm('¿Eliminar este chat?')) return;
    chats = chats.filter(c => c.id !== id);
    if (activeChatId === id) {
      activeChatId = chats.length > 0 ? chats[0].id : null;
    }
    saveChats();
    renderSidebar();
    renderMessages();
  };

  const openRename = (id, e) => {
    e.stopPropagation();
    renamingChatId = id;
    const chat = chats.find(c => c.id === id);
    document.getElementById('inp-rename').value = chat.title;
    modalRename.classList.add('active');
    setTimeout(() => document.getElementById('inp-rename').focus(), 50);
  };

  // 7. Renderizado
  const renderSidebar = () => {
    chatListEl.innerHTML = '';
    chats.forEach(chat => {
      const el = document.createElement('div');
      el.className = 'chat-item' + (chat.id === activeChatId ? ' active' : '');
      el.innerHTML = `
        <span class="title">${chat.title}</span>
        <div class="chat-actions">
          <button class="btn-icon-sm" onclick="openRename('${chat.id}', event)" title="Renombrar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          </button>
          <button class="btn-icon-sm" onclick="deleteChat('${chat.id}', event)" title="Eliminar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        </div>
      `;
      el.onclick = () => {
        activeChatId = chat.id;
        saveChats();
        renderSidebar();
        renderMessages();
      };
      chatListEl.appendChild(el);
    });
  };

  const renderMessages = () => {
    messagesEl.innerHTML = '';
    const chat = getActiveChat();
    
    if (!chat) {
      chatTitle.textContent = 'Selecciona o crea un chat';
      messagesEl.innerHTML = `<div style="text-align:center; color:var(--muted); margin-top:20px; font-size:13px;">Abre un chat o crea uno nuevo para empezar.</div>`;
      inputBox.disabled = true;
      btnSend.disabled = true;
      return;
    }

    chatTitle.textContent = chat.title;
    inputBox.disabled = false;
    btnSend.disabled = false;

    chat.messages.forEach(msg => {
      addMessageToDOM(msg.role, msg.content);
    });
    
    messagesEl.scrollTop = messagesEl.scrollHeight;
  };

  // Renderiza el globo + el avatar SVG (CORREGIDO)
  const addMessageToDOM = (role, text) => {
    if (role === 'error') {
      const el = document.createElement('div');
      el.className = 'msg error';
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return;
    }

    const container = document.createElement('div');
    // CORRECCIÓN: Asignar 'user' o 'ai' dependiendo del rol
    const styleClass = role === 'assistant' ? 'ai' : 'user';
    container.className = `msg-container ${styleClass}`;
    
    let avatarHtml = '';
    if (role === 'assistant') {
      avatarHtml = `<div class="msg-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg></div>`;
    }

    // CORRECCIÓN: Usar styleClass en lugar de role
    container.innerHTML = `
      ${avatarHtml}
      <div class="msg ${styleClass}">${text}</div>
    `;
    
    messagesEl.appendChild(container);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  };

  // 8. Lógica de Envío y API
  const sendMessage = async () => {
    const text = inputBox.value.trim();
    if (!text || isGenerating || !activeChatId) return;

    if (!config.token) {
      modalSettings.classList.add('active');
      alert('Por favor, introduce tu API Token de OpenRouter en los ajustes primero.');
      return;
    }

    const chat = getActiveChat();
    
    chat.messages.push({ role: 'user', content: text });
    addMessageToDOM('user', text);
    inputBox.value = '';
    
    // Restaurar input a 1 línea
    inputBox.style.height = '44px';
    inputBox.style.overflowY = 'hidden';

    saveChats();

    if (chat.messages.length === 1) {
      chat.title = text.substring(0, 20) + (text.length > 20 ? '...' : '');
      renderSidebar();
      chatTitle.textContent = chat.title;
      saveChats();
    }

    isGenerating = true;
    btnSend.disabled = true;
    inputBox.disabled = true;

    const typingEl = document.createElement('div');
    typingEl.className = 'typing-container';
    typingEl.innerHTML = `
      <div class="msg-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg></div>
      <div class="typing"><span></span><span></span><span></span></div>
    `;
    messagesEl.appendChild(typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${config.token}`,
          'HTTP-Referer': 'https://myhub.com',
          'X-Title': 'He-nteligens'
        },
        body: JSON.stringify({
          model: config.model,
          messages: [
            { role: 'system', content: getSystemPrompt() },
            ...chat.messages
          ],
          temperature: 0.7
        })
      });

      const data = await response.json();
      typingEl.remove();

      if (!response.ok) {
        throw new Error(data.error?.message || 'Error en la petición (Revisa tu Token y Modelo)');
      }

      const aiText = data.choices[0].message.content;
      chat.messages.push({ role: 'assistant', content: aiText });
      addMessageToDOM('assistant', aiText);
      saveChats();

    } catch (error) {
      typingEl.remove();
      addMessageToDOM('error', `Error: ${error.message}`);
    } finally {
      isGenerating = false;
      btnSend.disabled = false;
      inputBox.disabled = false;
      inputBox.focus();
    }
  };

  // 9. Event Listeners
  
  document.getElementById('btn-toggle-sidebar').onclick = () => {
    sidebarEl.classList.toggle('collapsed');
  };

  document.getElementById('btn-new-chat').onclick = createChat;

  document.getElementById('btn-open-settings').onclick = () => {
    document.getElementById('inp-token').value = config.token;
    document.getElementById('inp-model').value = config.model;
    document.getElementById('inp-name').value = config.name;
    document.getElementById('sel-length').value = config.length;
    modalSettings.classList.add('active');
  };

  const freeModels = [
    'liquid/lfm-2.5-2.6b:free',
    'dots-studio/dots-3-note-preview:free',
    'poolside/laguna-xs-2.1:free',
    'openrouter/free'
  ];

  document.getElementById('btn-random-model').onclick = () => {
    const randomModel = freeModels[Math.floor(Math.random() * freeModels.length)];
    document.getElementById('inp-model').value = randomModel;
  };

  document.getElementById('btn-cancel-settings').onclick = () => modalSettings.classList.remove('active');
  document.getElementById('btn-save-settings').onclick = () => {
    config.token = document.getElementById('inp-token').value.trim();
    config.model = document.getElementById('inp-model').value.trim() || 'openai/gpt-4o-mini';
    config.name = document.getElementById('inp-name').value.trim() || 'Usuario';
    config.length = document.getElementById('sel-length').value;
    saveConfig();
    modalSettings.classList.remove('active');
    if (window.MyHub) window.MyHub.toast('Ajustes guardados');
  };

  document.getElementById('btn-cancel-rename').onclick = () => modalRename.classList.remove('active');
  document.getElementById('btn-save-rename').onclick = () => {
    const newName = document.getElementById('inp-rename').value.trim();
    if (newName && renamingChatId) {
      const chat = chats.find(c => c.id === renamingChatId);
      chat.title = newName;
      saveChats();
      renderSidebar();
      if (activeChatId === renamingChatId) chatTitle.textContent = newName;
    }
    modalRename.classList.remove('active');
  };

  // Lógica del Input (Auto-expandible)
  inputBox.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputBox.addEventListener('input', () => {
    inputBox.style.height = '44px'; // Resetear altura base
    const newHeight = Math.min(inputBox.scrollHeight, 120);
    inputBox.style.height = newHeight + 'px';
    if (newHeight === 44) inputBox.style.overflowY = 'hidden';
    else inputBox.style.overflowY = 'auto';
  });

  btnSend.onclick = sendMessage;

  // Iniciar
  renderSidebar();
  renderMessages();
  if (!config.token) {
    setTimeout(() => modalSettings.classList.add('active'), 500);
  }
</script>
</body>
</html>
