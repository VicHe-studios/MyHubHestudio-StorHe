<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.15);
    --text: #0b1220;
    --muted: #64748b;
    --line: rgba(15, 23, 42, 0.08);
    --card: #ffffff;
    --field: #f6f8fb;
  }
  html[data-modo="oscuro"] {
    --text: #f4f4f6;
    --muted: #9ea1aa;
    --line: rgba(255, 255, 255, 0.09);
    --card: #222227;
    --field: #2a2a31;
  }
  * { box-sizing: border-box; }
  html, body { height: 100vh; width: 100%; margin: 0; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    font-family: 'Segoe UI Variable', system-ui, sans-serif;
    background: var(--card); color: var(--text);
  }

  .header {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    background: var(--card); flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { margin: 0; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .header h1 svg { color: var(--accent); width: 18px; height: 18px; }

  .content {
    flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px; overflow-y: auto;
  }

  .lang-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  
  select {
    flex: 1; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line);
    background: var(--field); color: var(--text); font: inherit; font-size: 13px; font-weight: 600;
    outline: none; cursor: pointer; appearance: none; text-align: center;
  }
  select:focus { border-color: var(--accent); }

  .btn-swap {
    background: var(--field); border: 1.5px solid var(--line); color: var(--muted);
    width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: 0.2s; flex-shrink: 0;
  }
  .btn-swap:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); transform: rotate(180deg); }
  .btn-swap svg { width: 16px; height: 16px; }

  .panel {
    flex: 1; display: flex; flex-direction: column; position: relative; min-height: 120px;
  }
  textarea {
    width: 100%; height: 100%; resize: none; padding: 12px;
    border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--field); color: var(--text); font: inherit; font-size: 14px;
    outline: none; transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea[readonly] { background: var(--card); color: var(--muted); }

  .actions { display: flex; justify-content: center; margin-top: 4px; }
  .btn-primary {
    background: var(--accent); color: #fff; border: none; padding: 10px 24px;
    border-radius: 10px; font: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
  }
  .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-primary svg { width: 16px; height: 16px; }

  .app-credit {
    text-align: center; font-size: 11px; color: var(--muted); padding: 8px;
    border-top: 1px solid var(--line); background: var(--card); flex-shrink: 0;
  }
  .app-credit a { color: var(--accent); text-decoration: none; font-weight: 600; }

  @keyframes spin { 100% { transform: rotate(360deg); } }
  .spinner { animation: spin 1s linear infinite; }
</style>
</head>
<body>

  <div class="header">
    <h1><i data-lucide="languages"></i> Trans-He</h1>
  </div>

  <div class="content">
    <div class="lang-row">
      <select id="lang-src">
        <option value="es">Español</option>
        <option value="en" selected>Inglés</option>
        <option value="fr">Francés</option>
        <option value="pt">Portugués</option>
        <option value="it">Italiano</option>
        <option value="de">Alemán</option>
        <option value="ja">Japonés</option>
        <option value="zh-CN">Chino</option>
        <option value="ru">Ruso</option>
      </select>
      <button class="btn-swap" id="btn-swap" title="Intercambiar idiomas">
        <i data-lucide="arrow-right-left"></i>
      </button>
      <select id="lang-tgt">
        <option value="es" selected>Español</option>
        <option value="en">Inglés</option>
        <option value="fr">Francés</option>
        <option value="pt">Portugués</option>
        <option value="it">Italiano</option>
        <option value="de">Alemán</option>
        <option value="ja">Japonés</option>
        <option value="zh-CN">Chino</option>
        <option value="ru">Ruso</option>
      </select>
    </div>

    <div class="panel">
      <textarea id="text-src" placeholder="Escribe el texto a traducir aquí..."></textarea>
    </div>

    <div class="actions">
      <button class="btn-primary" id="btn-translate">
        <i data-lucide="sparkles"></i> Traducir
      </button>
    </div>

    <div class="panel">
      <textarea id="text-tgt" placeholder="La traducción aparecerá aquí..." readonly></textarea>
    </div>
  </div>

  <div class="app-credit">
    Traducción por <a href="https://mymemory.translated.net/" target="_blank">MyMemory API</a>
  </div>

  <script src="../../vendor/lucide.min.js"></script>
  <script>
    if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
    window.addEventListener('message', (e) => {
      if (e.data?.type === 'myhub:tema:res') {
        document.documentElement.dataset.modo = e.data.modo;
        document.documentElement.style.setProperty('--accent', e.data.color);
        document.documentElement.style.setProperty('--accent-soft', e.data.color + '26');
      }
    });

    const textSrc = document.getElementById('text-src');
    const textTgt = document.getElementById('text-tgt');
    const langSrc = document.getElementById('lang-src');
    const langTgt = document.getElementById('lang-tgt');
    const btnTranslate = document.getElementById('btn-translate');

    const translate = async () => {
      const text = textSrc.value.trim();
      if (!text) return;

      const src = langSrc.value;
      const tgt = langTgt.value;

      if (src === tgt) {
        textTgt.value = text;
        return;
      }

      // Estado de carga
      btnTranslate.disabled = true;
      btnTranslate.innerHTML = `<svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Traduciendo...`;
      textTgt.value = '';

      try {
        // Usamos la API pública de MyMemory
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${src}|${tgt}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.responseData && data.responseData.translatedText) {
          textTgt.value = data.responseData.translatedText;
        } else {
          textTgt.value = "Error: No se pudo traducir el texto.";
        }
      } catch (err) {
        textTgt.value = "Error de conexión. Revisa tu internet.";
      } finally {
        btnTranslate.disabled = false;
        btnTranslate.innerHTML = `<i data-lucide="sparkles"></i> Traducir`;
        if (window.lucide) lucide.createIcons();
      }
    };

    btnTranslate.onclick = translate;

    // Atajo: Ctrl + Enter para traducir
    textSrc.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') translate();
    });

    // Intercambiar idiomas
    document.getElementById('btn-swap').onclick = () => {
      const temp = langSrc.value;
      langSrc.value = langTgt.value;
      langTgt.value = temp;
      
      // Si ya hay un texto traducido, lo movemos al panel de origen
      if (textTgt.value.trim()) {
        textSrc.value = textTgt.value;
        textTgt.value = '';
      }
    };

    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
