<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root {
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.15);
    --text: #0b1220;
    --muted: #64748b;
    --field: #f6f8fb;
    --line: rgba(15, 23, 42, 0.08);
  }
  html[data-modo="oscuro"] {
    --text: #f4f4f6;
    --muted: #9ea1aa;
    --field: #2a2a31;
    --line: rgba(255, 255, 255, 0.09);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; width: 100vw;
    background: transparent; overflow: hidden; border-radius: 16px;
    font-family: 'Segoe UI Variable', system-ui, sans-serif;
    color: var(--text);
  }
  
  .widget {
    height: 100%; display: flex; flex-direction: column; padding: 14px; gap: 8px;
  }
  
  /* Cabecera */
  .header { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .header svg { width: 16px; height: 16px; color: var(--accent); }
  .header-title { font-weight: 700; font-size: 13px; }
  .chat-title { 
    font-size: 10px; color: var(--muted); font-weight: 600; 
    text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; 
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  
  /* Ventana de mensaje */
  .preview {
    flex: 1; background: var(--field); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; font-size: 12px; line-height: 1.4;
    color: var(--text); overflow-y: auto; position: relative;
  }
  .preview.ai { border-left: 3px solid var(--accent); }
  .preview.user { border-left: 3px solid var(--muted); }
  
  .preview-role { 
    font-size: 9px; font-weight: 700; color: var(--muted); 
    text-transform: uppercase; margin-bottom: 4px; 
  }
  .preview-text { word-break: break-word; white-space: pre-wrap; }
  .preview.loading { display: flex; align-items: center; justify-content: center; color: var(--muted); font-style: italic; }

  /* Zona de escritura */
  .input-area {
    display: flex; gap: 6px; flex-shrink: 0;
  }
  .input-box {
    flex: 1; padding: 6px 10px; border-radius: 8px; font-size: 12px;
    border: 1.5px solid var(--line); background: var(--field); color: var(--text);
    outline: none; transition: border-color 0.2s; font-family: inherit;
    min-width: 0;
  }
  .input-box:focus { border-color: var(--accent); }
  .input-box:disabled { opacity: 0.5; }
  
  .btn-send {
    background: var(--accent); color: #fff; border: none;
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: 0.2s;
  }
  .btn-send:hover { filter: brightness(1.1); transform: scale(1.05); }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-send svg { width: 14px; height: 14px; }

  /* Estado vacío */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--muted); gap: 8px; font-size: 11px; text-align: center;
    border-radius: 16px; border: 1px dashed var(--line);
  }
  .empty-state svg { width: 28px; height: 28px; opacity: 0.5; }
</style>
</head>
<body>

  <div class="widget" id="main" style="display:none;">
    <div>
      <div class="header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>
        <span class="header-title">He-nteligens</span>
      </div>
      <div class="chat-title" id="chat-title">-</div>
    </div>
    
    <div class="preview ai" id="preview">
      <div class="preview-role" id="preview-role">Último mensaje</div>
      <div class="preview-text" id="preview-text">...</div>
    </div>

    <div class="input-area">
      <input type="text" class="input-box" id="msg-input" placeholder="Escribe aquí..." autocomplete="off">
      <button class="btn-send" id="btn-send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>

  <div class="empty-state" id="empty" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>
    <span>Sin chats</span>
  </div>
  
<script>
  // Tema
  if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'myhub:tema:res') {
      document.documentElement.dataset.modo = e.data.modo;
      document.documentElement.style.setProperty('--accent', e.data.color);
      document.documentElement.style.setProperty('--accent-soft', e.data.color + '26');
    }
  });

  const mainEl = document.getElementById('main');
  const emptyEl = document.getElementById('empty');
  const previewEl = document.getElementById('preview');
  const previewRole = document.getElementById('preview-role');
  const previewText = document.getElementById('preview-text');
  const chatTitleEl = document.getElementById('chat-title');
  const msgInput = document.getElementById('msg-input');
  const btnSend = document.getElementById('btn-send');

  let isGenerating = false;

  // Leer configuración para el System Prompt
  function getSystemPrompt() {
    const config = JSON.parse(localStorage.getItem('myhub_he_nteligence_config') || '{}');
    const lengths = {
      short: 'Responde de forma muy breve y directa, en 1 o 2 frases máximo.',
      medium: 'Responde con un párrafo conciso y bien estructurado.',
      long: 'Proporciona una explicación detallada y completa.',
      detailed: 'Proporciona un análisis muy profundo, exhaustivo y con ejemplos si es necesario.'
    };
    const name = config.name || 'Usuario';
    const len = config.length || 'medium';
    return `Eres He-nteligens, un asistente de IA útil e inteligente. El usuario se llama ${name}. ${lengths[len]}`;
  }

  function render() {
    if (isGenerating) return; // No molestar mientras escribe

    const chats = JSON.parse(localStorage.getItem('myhub_he_nteligence_chats') || '[]');
    const activeId = localStorage.getItem('myhub_he_nteligence_active');
    
    let chat = chats.find(c => c.id === activeId);
    if (!chat && chats.length > 0) chat = chats[0];

    if (!chat || chat.messages.length === 0) {
      mainEl.style.display = 'none';
      emptyEl.style.display = 'flex';
      msgInput.disabled = true;
      btnSend.disabled = true;
      return;
    }

    mainEl.style.display = 'flex';
    emptyEl.style.display = 'none';
    msgInput.disabled = false;
    
    chatTitleEl.textContent = chat.title || 'Chat sin título';

    const lastMsg = chat.messages[chat.messages.length - 1];
    const isAI = lastMsg.role === 'assistant';
    
    previewEl.className = 'preview ' + (isAI ? 'ai' : 'user');
    previewRole.textContent = isAI ? 'He-nteligens' : 'Tú';
    previewText.textContent = lastMsg.content;
    previewEl.scrollTop = previewEl.scrollHeight;
  }

  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || isGenerating) return;

    const config = JSON.parse(localStorage.getItem('myhub_he_nteligence_config') || '{}');
    if (!config.token) {
      previewRole.textContent = 'Error';
      previewText.textContent = 'Configura tu Token en la app principal primero.';
      previewEl.className = 'preview user';
      return;
    }

    let chats = JSON.parse(localStorage.getItem('myhub_he_nteligence_chats') || '[]');
    let activeId = localStorage.getItem('myhub_he_nteligence_active');
    let chat = chats.find(c => c.id === activeId);

    // Si no hay chat, crear uno nuevo
    if (!chat) {
      chat = { id: 'chat_' + Date.now(), title: 'Nuevo Chat', messages: [] };
      chats.unshift(chat);
      localStorage.setItem('myhub_he_nteligence_active', chat.id);
    }

    // Guardar mensaje del usuario
    chat.messages.push({ role: 'user', content: text });
    if (chat.messages.length === 1) {
      chat.title = text.substring(0, 20) + (text.length > 20 ? '...' : '');
    }
    localStorage.setItem('myhub_he_nteligence_chats', JSON.stringify(chats));

    // UI Loading
    isGenerating = true;
    msgInput.value = '';
    msgInput.disabled = true;
    btnSend.disabled = true;
    previewEl.className = 'preview loading';
    previewRole.textContent = 'He-nteligens';
    previewText.textContent = 'Pensando...';
    render(); // Actualiza el título

    try {
      const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${config.token}`,
          'HTTP-Referer': 'https://myhub.com',
          'X-Title': 'He-nteligens Widget'
        },
        body: JSON.stringify({
          model: config.model || 'openai/gpt-4o-mini',
          messages: [
            { role: 'system', content: getSystemPrompt() },
            ...chat.messages
          ],
          temperature: 0.7
        })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error?.message || 'Error de API');

      // Guardar respuesta IA
      const aiText = data.choices[0].message.content;
      
      // Recargar chats porque el localStorage pudo haber cambiado
      chats = JSON.parse(localStorage.getItem('myhub_he_nteligence_chats') || '[]');
      chat = chats.find(c => c.id === chat.id) || chat; 
      
      chat.messages.push({ role: 'assistant', content: aiText });
      localStorage.setItem('myhub_he_nteligence_chats', JSON.stringify(chats));

    } catch (error) {
      previewRole.textContent = 'Error';
      previewText.textContent = error.message;
      previewEl.className = 'preview user';
      isGenerating = false;
      render();
      return;
    }

    isGenerating = false;
    msgInput.disabled = false;
    btnSend.disabled = false;
    render();
  }

  // Eventos
  msgInput.addEventListener('input', () => {
    btnSend.disabled = msgInput.value.trim().length === 0;
  });

  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  btnSend.onclick = sendMessage;

  render();
  setInterval(render, 3000); // Sincronización pasiva
  
  window.addEventListener('storage', (e) => {
    if (e.key && e.key.includes('myhub_he_nteligence')) render();
  });
</script>
</body>
</html>
