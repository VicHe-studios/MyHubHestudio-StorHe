<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0; height: 100vh; width: 100vw;
    background: transparent; overflow-y: hidden; 
    overflow-x: auto; /* Scroll horizontal */
    border-radius: 16px;
    font-family: 'Segoe UI Variable', system-ui, sans-serif;
  }

  /* Scrollbar muy fina para que no rompa el diseño 1x1 */
  ::-webkit-scrollbar { height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line, rgba(255,255,255,0.2)); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent, #2563eb); }

  /* Forzamos el ancho a 1000px para que sea un mapa mundi alargado */
  #map {
    width: 1000px; 
    height: 100%; 
    z-index: 1;
    background: #e5e5e5;
  }

  /* Ocultar controles */
  .leaflet-control-zoom, .leaflet-control-attribution { display: none !important; }
</style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
    
    let map;
    let tileLayer;

    window.addEventListener('message', (e) => {
      if (e.data?.type === 'myhub:tema:res') {
        document.documentElement.dataset.modo = e.data.modo;
        document.documentElement.style.setProperty('--accent', e.data.color);
        setMapTheme(e.data.modo);
      }
    });

    const setMapTheme = (modo) => {
      if (!map) return;
      if (tileLayer) map.removeLayer(tileLayer);
      
      const isDark = modo === 'oscuro';
      const url = isDark 
        ? 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}'
        : 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}';
        
      tileLayer = L.tileLayer(url).addTo(map);
    };

    // Inicializar mapa con ZOOM FIJO en 2 (Mapa Mundi)
    map = L.map('map', {
      zoomControl: false,
      dragging: false,
      touchZoom: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false,
      zoomAnimation: false,
      attributionControl: false,
      minZoom: 2,
      maxZoom: 2,
      zoomSnap: 0
    }).setView([20, 0], 2); // El 2 es el nivel exacto para ver todo el mundo

    setMapTheme('claro');

    // Ajustar tamaño para evitar recortes
    setTimeout(() => {
      map.invalidateSize();
    }, 300);
  </script>
</body>
</html>
