<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; width: 100vw;
    background: transparent; overflow: hidden; border-radius: 16px;
    font-family: 'Segoe UI Variable', system-ui, sans-serif;
    position: relative;
  }

  #map {
    width: 100%; height: 100%; z-index: 1;
    border-radius: 16px; background: #e5e5e5;
  }

  /* Ocultar controles para un look limpio en 1x1 */
  .leaflet-control-zoom { display: none; }
  .leaflet-control-attribution { display: none !important; } /* Oculto visualmente por espacio */

  /* Overlay para que el mapa no se vea "plano" y tenga profundidad */
  .map-overlay {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    border-radius: 16px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
    background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.4) 100%);
  }

  /* Indicador de ubicación */
  .location-badge {
    position: absolute; bottom: 8px; left: 8px; z-index: 3;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    color: #fff; font-size: 10px; font-weight: 700;
    padding: 4px 8px; border-radius: 8px;
    display: flex; align-items: center; gap: 4px;
    pointer-events: none;
  }
  .location-badge svg { width: 12px; height: 12px; color: var(--accent, #2563eb); }

  /* Pin personalizado */
  .custom-pin {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent, #2563eb);
    border: 2.5px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .pin-pulse {
    position: absolute; top: -4px; left: -4px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--accent, #2563eb);
    opacity: 0.6; animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(2.5); opacity: 0; }
  }
</style>
</head>
<body>

  <div id="map"></div>
  <div class="map-overlay"></div>
  
  <div class="location-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    Ubicación
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. Sincronización de Tema
    if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
    
    let map;
    let tileLayer;
    const DEFAULT_LAT = -33.45; // Santiago, por si falla la geolocalización
    const DEFAULT_LON = -70.66;

    window.addEventListener('message', (e) => {
      if (e.data?.type === 'myhub:tema:res') {
        document.documentElement.dataset.modo = e.data.modo;
        document.documentElement.style.setProperty('--accent', e.data.color);
        setMapTheme(e.data.modo);
      }
    });

    // 2. Configurar Capas del Mapa
    const setMapTheme = (modo) => {
      if (!map) return;
      if (tileLayer) map.removeLayer(tileLayer);
      
      const isDark = modo === 'oscuro';
      const url = isDark 
        ? 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}'
        : 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}';
        
      tileLayer = L.tileLayer(url, { maxZoom: 18 }).addTo(map);
    };

    // 3. Inicializar Mapa (Totalmente bloqueado)
    map = L.map('map', {
      zoomControl: false,
      dragging: false,
      touchZoom: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false,
      zoomAnimation: false,
      attributionControl: false // Ocultamos la atribución por falta de espacio
    }).setView([DEFAULT_LAT, DEFAULT_LON], 14); // Zoom 14 para ver calles en espacio pequeño

    setMapTheme('claro');

    // 4. Icono Personalizado (Punto pulsante)
    const customIcon = L.divIcon({
      className: 'custom-icon',
      html: `<div class="pin-pulse"></div><div class="custom-pin"></div>`,
      iconSize: [12, 12],
      iconAnchor: [6, 6]
    });

    // 5. Geolocalización
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          map.setView([lat, lon], 15); // Zoom más cercano si es tu ubicación
          L.marker([lat, lon], { icon: customIcon }).addTo(map);
        },
        () => {
          // Si falla, usar ubicación por defecto
          L.marker([DEFAULT_LAT, DEFAULT_LON], { icon: customIcon }).addTo(map);
        }
      );
    } else {
      L.marker([DEFAULT_LAT, DEFAULT_LON], { icon: customIcon }).addTo(map);
    }

    // Fix para que Leaflet calcule bien el tamaño en un iframe 1x1
    setTimeout(() => map.invalidateSize(), 200);
  </script>
</body>
</html>
