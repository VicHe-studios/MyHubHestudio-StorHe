<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; width: 100vw;
    background: transparent; overflow: hidden; border-radius: 16px;
    font-family: 'Segoe UI Variable', system-ui, sans-serif;
  }

  #map {
    width: 100%; height: 100%; z-index: 1;
    border-radius: 16px; background: #e5e5e5;
  }

  /* Ocultar todos los controles para un look ultra limpio */
  .leaflet-control-zoom { display: none; }
  .leaflet-control-attribution { display: none !important; }

  /* Punto central minimalista */
  .center-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent, #2563eb);
    border: 1.5px solid #fff;
    box-shadow: 0 0 8px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. Sincronización de Tema
    if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
    
    let map;
    let tileLayer;

    window.addEventListener('message', (e) => {
      if (e.data?.type === 'myhub:tema:res') {
        document.documentElement.dataset.modo = e.data.modo;
        document.documentElement.style.setProperty('--accent', e.data.color);
        setMapTheme(e.data.modo);
      }
    });

    // 2. Configurar Capas del Mapa
    const setMapTheme = (modo) => {
      if (!map) return;
      if (tileLayer) map.removeLayer(tileLayer);
      
      const isDark = modo === 'oscuro';
      const url = isDark 
        ? 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}'
        : 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}';
        
      tileLayer = L.tileLayer(url, { maxZoom: 18 }).addTo(map);
    };

    // 3. Inicializar Mapa Global (Zoom 2 para ver continentes)
    map = L.map('map', {
      zoomControl: false,
      dragging: false,
      touchZoom: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false,
      zoomAnimation: false,
      attributionControl: false
    }).setView([20, 0], 2); // Centro en el ecuador, zoom 2 para ver el mundo

    setMapTheme('claro');

    // 4. Icono Central (Solo un punto sutil)
    const centerIcon = L.divIcon({
      className: 'center-icon',
      html: `<div class="center-dot"></div>`,
      iconSize: [8, 8],
      iconAnchor: [4, 4]
    });

    // Poner un marcador en el centro del mundo para que no se vea vacío
    L.marker([20, 0], { icon: centerIcon }).addTo(map);

    // Fix para que Leaflet calcule bien el tamaño en un iframe
    setTimeout(() => map.invalidateSize(), 200);
  </script>
</body>
</html>
