<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0; height: 100vh; width: 100vw;
    background: transparent; overflow-y: hidden; 
    overflow-x: auto; /* Aquí activamos el scroll horizontal */
    border-radius: 16px;
    font-family: 'Segoe UI Variable', system-ui, sans-serif;
  }

  /* Scrollbar fina y estilizada para el widget */
  ::-webkit-scrollbar {
    height: 5px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: var(--line, rgba(255,255,255,0.2));
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--accent, #2563eb);
  }

  /* El mapa es 3 veces más ancho que el widget para ver todo el mundo */
  #map {
    width: 300%; 
    height: 100%; 
    z-index: 1;
    border-radius: 16px 0 0 16px;
    background: #e5e5e5;
  }

  /* Ocultar controles de Leaflet */
  .leaflet-control-zoom, .leaflet-control-attribution { display: none !important; }
</style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. Sincronización de Tema
    if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
    
    let map;
    let tileLayer;

    window.addEventListener('message', (e) => {
      if (e.data?.type === 'myhub:tema:res') {
        document.documentElement.dataset.modo = e.data.modo;
        document.documentElement.style.setProperty('--accent', e.data.color);
        setMapTheme(e.data.modo);
      }
    });

    // 2. Configurar Capas del Mapa
    const setMapTheme = (modo) => {
      if (!map) return;
      if (tileLayer) map.removeLayer(tileLayer);
      
      const isDark = modo === 'oscuro';
      const url = isDark 
        ? 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}'
        : 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}';
        
      tileLayer = L.tileLayer(url, { maxZoom: 18 }).addTo(map);
    };

    // 3. Inicializar Mapa
    map = L.map('map', {
      zoomControl: false,
      dragging: false,
      touchZoom: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false,
      zoomAnimation: false,
      attributionControl: false
    }).setView([20, 0], 1); // Zoom 1 para ver el mundo

    setMapTheme('claro');

    // 4. Ajuste de tamaño para el contenedor expandido
    setTimeout(() => {
      map.invalidateSize();
    }, 300);
  </script>
</body>
</html>
