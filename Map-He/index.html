<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.15);
    --text: #0b1220;
    --muted: #64748b;
    --line: rgba(15, 23, 42, 0.08);
    --card: #ffffff;
    --field: #f6f8fb;
  }
  html[data-modo="oscuro"] {
    --text: #f4f4f6;
    --muted: #9ea1aa;
    --line: rgba(255, 255, 255, 0.09);
    --card: #222227;
    --field: #2a2a31;
  }
  * { box-sizing: border-box; }
  html, body { height: 100vh; width: 100%; margin: 0; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    font-family: 'Segoe UI Variable', system-ui, sans-serif;
    background: var(--card); color: var(--text);
  }

  /* Scrollbar Estilizada */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .header {
    padding: 8px 12px; border-bottom: 1px solid var(--line);
    background: var(--card); flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; z-index: 1000;
  }
  .header-left { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; }
  .header-left svg { width: 16px; height: 16px; color: var(--accent); }
  
  .search-box { display: flex; flex: 1; gap: 6px; max-width: 250px; }
  .search-box input {
    flex: 1; padding: 6px 10px; border-radius: 8px; border: 1.5px solid var(--line);
    background: var(--field); color: var(--text); font-size: 12px; outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }
  
  .btn {
    background: var(--accent); color: #fff; border: none; padding: 6px 10px;
    border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: 0.2s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn svg { width: 14px; height: 14px; }

  #map { flex: 1; width: 100%; z-index: 1; background: var(--field); }

  /* Leaflet Dark Mode fixes */
  html[data-modo="oscuro"] .leaflet-popup-content-wrapper, 
  html[data-modo="oscuro"] .leaflet-popup-tip { 
    background: var(--card); color: var(--text); 
  }
  html[data-modo="oscuro"] .leaflet-container { background: #1a1a1a; }
  html[data-modo="oscuro"] .leaflet-control-zoom a {
    background-color: var(--card); color: var(--text); border-color: var(--line);
  }
  html[data-modo="oscuro"] .leaflet-control-attribution {
    background: var(--card) !important; color: var(--muted) !important;
  }
  html[data-modo="oscuro"] .leaflet-control-attribution a { color: var(--accent) !important; }

  .app-credit {
    text-align: center; font-size: 11px; color: var(--muted); padding: 6px;
    border-top: 1px solid var(--line); background: var(--card); flex-shrink: 0;
    z-index: 1000;
  }
  .app-credit a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg>
      Map-He
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Buscar lugar..." autocomplete="off">
      <button class="btn" id="btn-search" title="Buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="btn" id="btn-locate" title="Mi ubicación">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>

  <div id="map"></div>

  <div class="app-credit">
    Mapas por <a href="https://www.openstreetmap.org/" target="_blank">OpenStreetMap</a> y <a href="https://leafletjs.com/" target="_blank">Leaflet</a>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
    
    let map;
    let tileLayer;
    let marker = null;

    // Inicializar Mapa
    map = L.map('map', { zoomControl: false }).setView([20, 0], 2);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Función para cambiar las capas del mapa según el tema
    const setMapTheme = (modo) => {
      if (tileLayer) map.removeLayer(tileLayer);
      
      const isDark = modo === 'oscuro';
      const url = isDark 
        ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
        : 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
        
      tileLayer = L.tileLayer(url, {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors © CARTO'
      }).addTo(map);
    };

    // Iniciar en claro por defecto
    setMapTheme('claro');

    // Escuchar cambios de tema
    window.addEventListener('message', (e) => {
      if (e.data?.type === 'myhub:tema:res') {
        document.documentElement.dataset.modo = e.data.modo;
        document.documentElement.style.setProperty('--accent', e.data.color);
        document.documentElement.style.setProperty('--accent-soft', e.data.color + '26');
        setMapTheme(e.data.modo);
      }
    });

    const setMarker = (lat, lon, title) => {
      if (marker) map.removeLayer(marker);
      marker = L.marker([lat, lon]).addTo(map);
      if (title) marker.bindPopup(title).openPopup();
      map.setView([lat, lon], 13);
    };

    const searchPlace = async () => {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const data = await res.json();
        
        if (data && data.length > 0) {
          const place = data[0];
          setMarker(place.lat, place.lon, place.display_name);
        } else {
          alert('No se encontraron resultados para esa búsqueda.');
        }
      } catch (err) {
        alert('Error al conectar con el servicio de mapas.');
      }
    };

    document.getElementById('btn-search').onclick = searchPlace;
    document.getElementById('search-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchPlace();
    });

    document.getElementById('btn-locate').onclick = () => {
      if (!navigator.geolocation) {
        return alert('La geolocalización no está soportada por tu navegador.');
      }
      
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude } = position.coords;
          setMarker(latitude, longitude, "¡Estás aquí!");
        },
        () => {
          alert('No se pudo obtener tu ubicación. Verifica los permisos.');
        }
      );
    };
  </script>
</body>
</html>
