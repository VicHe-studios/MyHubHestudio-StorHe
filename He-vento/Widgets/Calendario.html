<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root {
    --accent: #2563eb;
    --text: #0b1220;
    --muted: #64748b;
    --line: rgba(15, 23, 42, 0.08);
    --field: #f6f8fb;
  }
  html[data-modo="oscuro"] {
    --text: #f4f4f6;
    --muted: #9ea1aa;
    --line: rgba(255, 255, 255, 0.09);
    --field: #2a2a31;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; width: 100vw;
    display: flex; flex-direction: column;
    background: transparent; font-family: 'Segoe UI Variable', system-ui, sans-serif;
    user-select: none; overflow: hidden; padding: 16px;
  }

  /* Cabecera del Widget */
  .header {
    display: flex; flex-direction: column; gap: 2px;
    margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 12px;
  }
  .day-number {
    font-size: 48px; font-weight: 800; line-height: 1;
    letter-spacing: -2px; color: var(--text);
  }
  .month-name {
    font-size: 12px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 1px;
  }

  /* Lista de Eventos */
  .events-container {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
  }
  .events-container::-webkit-scrollbar { width: 0px; } /* Ocultar scrollbar en el widget */

  .event-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .event-item::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
  }

  .no-events {
    font-size: 12px; color: var(--muted); font-weight: 500;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 8px; opacity: 0.7;
  }
  .no-events svg { width: 24px; height: 24px; }
</style>
</head>
<body>

  <div class="header">
    <div class="day-number" id="day-num">--</div>
    <div class="month-name" id="month-str">---</div>
  </div>

  <div class="events-container" id="events-list">
    <!-- Aquí se inyectarán los eventos -->
  </div>

<script>
  // Sincronización de Tema
  if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'myhub:tema:res') {
      document.documentElement.dataset.modo = e.data.modo;
      document.documentElement.style.setProperty('--accent', e.data.color);
    }
  });

  const STORAGE_KEY = 'myhub_calendar_events';
  const dayNumEl = document.getElementById('day-num');
  const monthStrEl = document.getElementById('month-str');
  const eventsListEl = document.getElementById('events-list');

  const renderWidget = () => {
    const now = new Date();
    const todayStr = now.toISOString().split('T')[0]; // Formato YYYY-MM-DD
    
    // 1. Renderizar Fecha
    dayNumEl.textContent = now.getDate();
    const monthName = now.toLocaleDateString('es', { month: 'short', weekday: 'short' }).replace('.', '');
    monthStrEl.textContent = monthName.toUpperCase();

    // 2. Renderizar Eventos
    try {
      const eventsData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const todayEvents = eventsData[todayStr] || [];

      eventsListEl.innerHTML = '';

      if (todayEvents.length === 0) {
        eventsListEl.innerHTML = `
          <div class="no-events">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><path d="M9 14h6"/></svg>
            <span>Día libre</span>
          </div>
        `;
      } else {
        // Mostrar máximo 3 eventos para que no se desborde
        const maxEvents = 3;
        todayEvents.slice(0, maxEvents).forEach(ev => {
          const div = document.createElement('div');
          div.className = 'event-item';
          div.textContent = ev;
          eventsListEl.appendChild(div);
        });

        // Si hay más de 3, mostrar un resumen
        if (todayEvents.length > maxEvents) {
          const moreDiv = document.createElement('div');
          moreDiv.className = 'event-item';
          moreDiv.style.color = 'var(--muted)';
          moreDiv.style.marginTop = '4px';
          moreDiv.textContent = `+${todayEvents.length - maxEvents} eventos más`;
          eventsListEl.appendChild(moreDiv);
        }
      }
    } catch (e) {
      eventsListEl.innerHTML = `<div class="no-events"><span>Error de lectura</span></div>`;
    }
  };

  // Renderizado inicial
  renderWidget();

  // Escuchar cambios en el localStorage para actualizaciones en tiempo real
  window.addEventListener('storage', (e) => {
    if (e.key === STORAGE_KEY) renderWidget();
  });

  // Refrescar cada minuto por si cambia el día
  setInterval(renderWidget, 60000);
</script>
</body>
</html>
