<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.15);
    --bg: transparent;
    --text: #0b1220;
    --muted: #64748b;
    --line: rgba(15, 23, 42, 0.08);
    --card: #ffffff;
    --field: #f6f8fb;
    --ease-spring: cubic-bezier(0.2, 0.9, 0.3, 1.15);
  }
  
  html[data-modo="oscuro"] {
    --text: #f4f4f6;
    --muted: #9ea1aa;
    --line: rgba(255, 255, 255, 0.09);
    --card: #222227;
    --field: #2a2a31;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: 'Segoe UI Variable', system-ui, sans-serif;
    background: var(--card); color: var(--text);
    overflow: hidden;
  }

  /* Cabecera del calendario */
  .cal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--line);
    background: var(--card);
    flex-shrink: 0;
  }
  .cal-header h1 {
    margin: 0; font-size: 18px; font-weight: 700; text-transform: capitalize;
  }
  .btn-nav {
    background: var(--field); border: 1px solid var(--line);
    color: var(--text); width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-nav:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-nav svg { width: 16px; height: 16px; }

  /* Días de la semana */
  .weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    text-align: center; font-size: 11px; font-weight: 700;
    color: var(--muted); text-transform: uppercase;
    padding: 12px 10px 8px; background: var(--card);
    flex-shrink: 0;
  }

  /* Cuadrícula de días */
  .days-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 4px; padding: 0 10px 10px; flex: 1; overflow-y: auto;
    background: var(--card);
    align-content: start;
  }
  
  .day-cell {
    aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500;
    border: 1.5px solid transparent; position: relative;
    transition: all 0.15s;
  }
  .day-cell:hover { background: var(--field); }
  .day-cell.other-month { color: var(--muted); opacity: 0.4; }
  .day-cell.today { color: var(--accent); font-weight: 700; }
  .day-cell.selected {
    background: var(--accent-soft);
    border-color: var(--accent); color: var(--accent);
  }
  
  /* Puntito indicador de eventos */
  .day-cell.has-event::after {
    content: ''; position: absolute; bottom: 6px;
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--accent);
  }

  /* ===== PANEL RETRÁCTIL ===== */
  .events-panel {
    height: 48px; /* Altura por defecto (solo la barra) */
    display: flex; flex-direction: column;
    background: var(--field); border-top: 1px solid var(--line);
    transition: height 0.3s var(--ease-spring);
    flex-shrink: 0;
    overflow: hidden;
  }
  
  /* Cuando el panel está abierto */
  .events-panel.expanded {
    height: 220px;
  }

  .events-header {
    height: 48px; min-height: 48px; padding: 0 16px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; font-weight: 600; text-transform: capitalize;
    cursor: pointer; user-select: none;
    background: var(--field);
    transition: background 0.15s;
  }
  .events-header:hover { background: var(--line); }
  
  .events-header svg.chevron {
    width: 18px; height: 18px; color: var(--muted);
    transition: transform 0.3s var(--ease-spring);
  }
  /* Rotar la flechita cuando está abierto */
  .events-panel.expanded .events-header svg.chevron {
    transform: rotate(180deg);
  }

  /* Ocultar el resto del contenido cuando está cerrado */
  .events-panel:not(.expanded) .events-list,
  .events-panel:not(.expanded) .add-event-form {
    display: none;
  }

  .events-list {
    flex: 1; overflow-y: auto; padding: 8px 16px;
    list-style: none; margin: 0; display: flex; flex-direction: column; gap: 6px;
  }
  
  .event-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--line); font-size: 13px;
    animation: fadeIn 0.2s ease-out;
  }
  .event-delete {
    background: transparent; border: none; color: #ef4444;
    cursor: pointer; padding: 4px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
  }
  .event-delete:hover { background: rgba(239, 68, 68, 0.1); }
  .event-delete svg { width: 14px; height: 14px; }

  .add-event-form {
    display: flex; gap: 8px; padding: 12px 16px;
    background: var(--card); border-top: 1px solid var(--line);
  }
  .add-event-form input {
    flex: 1; padding: 8px 12px; border-radius: 8px;
    border: 1.5px solid var(--line); background: var(--field); color: var(--text);
    font-family: inherit; font-size: 13px; outline: none;
  }
  .add-event-form input:focus { border-color: var(--accent); }
  .btn-add-event {
    background: var(--accent); color: #fff; border: none;
    width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s;
  }
  .btn-add-event:hover { transform: scale(1.05); }
  .btn-add-event svg { width: 18px; height: 18px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>

  <div class="cal-header">
    <button class="btn-nav" id="prev-month">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <h1 id="month-year-title">Mes Año</h1>
    <button class="btn-nav" id="next-month">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>

  <div class="weekdays">
    <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
  </div>

  <div class="days-grid" id="days-grid"></div>

  <!-- Panel Retráctil -->
  <div class="events-panel" id="events-panel">
    <div class="events-header" id="events-header">
      <span id="events-title">Selecciona un día</span>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </div>
    <ul class="events-list" id="events-list"></ul>
    <div class="add-event-form" id="add-event-form">
      <input type="text" id="event-input" placeholder="Añadir evento...">
      <button class="btn-add-event" id="btn-add-event">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </div>
  </div>

<script>
  // Sincronización de Tema con MyHub
  if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'myhub:tema:res') {
      document.documentElement.dataset.modo = e.data.modo;
      document.documentElement.style.setProperty('--accent', e.data.color);
      document.documentElement.style.setProperty('--accent-soft', e.data.color + '26'); // Hex + opacidad
    }
  });

  // Lógica del Calendario
  let currentDate = new Date();
  let selectedDate = new Date().toISOString().split('T')[0];
  
  // Estructura de eventos: { "2026-10-20": ["Reunión", "Cumpleaños"] }
  let eventsData = JSON.parse(localStorage.getItem('myhub_calendar_events') || '{}');

  const monthYearTitle = document.getElementById('month-year-title');
  const daysGrid = document.getElementById('days-grid');
  const eventsTitle = document.getElementById('events-title');
  const eventsList = document.getElementById('events-list');
  const eventsPanel = document.getElementById('events-panel');
  const eventsHeader = document.getElementById('events-header');
  const eventInput = document.getElementById('event-input');

  // Función para abrir/cerrar el panel
  eventsHeader.onclick = () => {
    eventsPanel.classList.toggle('expanded');
  };

  const saveEvents = () => {
    localStorage.setItem('myhub_calendar_events', JSON.stringify(eventsData));
  };

  const renderCalendar = () => {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const monthName = currentDate.toLocaleDateString('es', { month: 'long', year: 'numeric' });
    monthYearTitle.textContent = monthName.charAt(0).toUpperCase() + monthName.slice(1);

    let firstDay = new Date(year, month, 1).getDay();
    firstDay = firstDay === 0 ? 6 : firstDay - 1;

    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();

    daysGrid.innerHTML = '';

    for (let i = firstDay - 1; i >= 0; i--) {
      const dayNum = daysInPrevMonth - i;
      const cell = document.createElement('div');
      cell.className = 'day-cell other-month';
      cell.textContent = dayNum;
      daysGrid.appendChild(cell);
    }

    const todayStr = new Date().toISOString().split('T')[0];
    
    for (let i = 1; i <= daysInMonth; i++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      cell.textContent = i;
      
      if (dateStr === todayStr) cell.classList.add('today');
      if (dateStr === selectedDate) cell.classList.add('selected');
      if (eventsData[dateStr] && eventsData[dateStr].length > 0) cell.classList.add('has-event');

      cell.onclick = () => {
        selectedDate = dateStr;
        // Si el panel está cerrado, lo abrimos al hacer clic en un día
        if (!eventsPanel.classList.contains('expanded')) {
          eventsPanel.classList.add('expanded');
        }
        renderCalendar();
        renderEvents();
      };

      daysGrid.appendChild(cell);
    }
  };

  const renderEvents = () => {
    const d = new Date(selectedDate + 'T00:00:00');
    const formattedDate = d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
    
    eventsTitle.textContent = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);
    
    eventsList.innerHTML = '';
    const dayEvents = eventsData[selectedDate] || [];

    if (dayEvents.length === 0) {
      eventsList.innerHTML = `<li style="color: var(--muted); font-size: 13px; text-align: center; margin-top: 10px;">No hay eventos para este día.</li>`;
    } else {
      dayEvents.forEach((ev, index) => {
        const li = document.createElement('li');
        li.className = 'event-item';
        li.innerHTML = `
          <span>${ev}</span>
          <button class="event-delete" onclick="deleteEvent(${index})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        `;
        eventsList.appendChild(li);
      });
    }
  };

  window.deleteEvent = (index) => {
    eventsData[selectedDate].splice(index, 1);
    if (eventsData[selectedDate].length === 0) delete eventsData[selectedDate];
    saveEvents();
    renderCalendar();
    renderEvents();
  };

  document.getElementById('btn-add-event').onclick = () => {
    const val = eventInput.value.trim();
    if (!val) return;
    
    if (!eventsData[selectedDate]) eventsData[selectedDate] = [];
    eventsData[selectedDate].push(val);
    eventInput.value = '';
    
    saveEvents();
    renderCalendar();
    renderEvents();
    
    // Hacer scroll al final de la lista para ver el nuevo evento
    setTimeout(() => { eventsList.scrollTop = eventsList.scrollHeight; }, 50);
  };

  eventInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btn-add-event').click();
  });

  document.getElementById('prev-month').onclick = () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  };
  document.getElementById('next-month').onclick = () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  };

  // Iniciar
  renderCalendar();
  renderEvents();
</script>
</body>
</html>
