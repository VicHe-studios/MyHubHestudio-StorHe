<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: #2563eb;
    --bg: transparent;
    --text: #0b1220;
    --muted: #64748b;
    --line: rgba(15, 23, 42, 0.08);
    --card: #ffffff;
    --field: #f6f8fb;
  }
  
  html[data-modo="oscuro"] {
    --text: #f4f4f6;
    --muted: #9ea1aa;
    --line: rgba(255, 255, 255, 0.09);
    --card: #222227;
    --field: #2a2a31;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    font-family: 'Segoe UI Variable', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;
  }

  /* Barra lateral más compacta */
  .sidebar {
    width: 130px; /* Reducido de 170px a 130px */
    background: var(--field);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    flex-shrink: 0;
  }
  
  .sidebar-header {
    padding: 12px 8px; border-bottom: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 8px;
  }
  
  .sidebar-header h2 { margin: 0; font-size: 12px; font-weight: 700; text-align: center; letter-spacing: 0.05em; color: var(--muted); text-transform: uppercase; }
  
  .header-btns {
    display: flex; gap: 4px; justify-content: space-between; align-items: center;
  }

  .btn-icon {
    background: transparent; color: var(--muted); border: none;
    width: 24px; height: 24px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-icon:hover { background: var(--line); color: var(--text); }
  .btn-icon svg { width: 14px; height: 14px; }

  .btn-add {
    background: var(--accent); color: #fff; border: none;
    width: 24px; height: 24px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; font-weight: bold;
    transition: transform 0.15s;
  }
  .btn-add:hover { transform: scale(1.05); filter: brightness(1.1); }

  .notes-list { flex: 1; overflow-y: auto; padding: 6px; }
  
  .note-item {
    padding: 8px; border-radius: 6px; cursor: pointer;
    display: flex; flex-direction: column; gap: 2px;
    margin-bottom: 2px;
    transition: background 0.15s, color 0.15s;
  }
  
  .note-item:hover, 
  .note-item.active { 
    background: var(--accent); 
    color: #fff; 
  }
  
  .note-item-title {
    font-size: 12px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .note-item-date { font-size: 10px; opacity: 0.7; }

  /* Área del editor con MUCHO más espacio */
  .editor {
    flex: 1; display: flex; flex-direction: column;
    background: var(--card); min-width: 0;
  }
  
  .editor-header { 
    padding: 24px 32px 16px; /* Más espacio para respirar */
    border-bottom: 1px solid var(--line); 
  }
  
  input.title-input {
    width: 100%; border: none; background: transparent;
    font-size: 24px; font-weight: 700; color: var(--text);
    outline: none; font-family: inherit;
  }
  
  textarea.content-input {
    flex: 1; width: 100%; border: none; background: transparent;
    padding: 24px 32px; /* Márgenes amplios para escribir cómodo */
    font-size: 15px; line-height: 1.7;
    color: var(--text); outline: none; resize: none;
    font-family: inherit;
  }

  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; font-style: italic;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Notas</h2>
      <div class="header-btns">
        <button class="btn-icon" id="btn-import" title="Importar desde TXT">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
        <button class="btn-icon" id="btn-export" title="Exportar a TXT">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </button>
        <button class="btn-add" id="btn-new" title="Nueva nota">+</button>
      </div>
    </div>
    <div class="notes-list" id="notes-list"></div>
    <input type="file" id="file-import" accept=".txt" hidden>
  </div>

  <div class="editor" id="editor-area">
    <div class="empty-state">Selecciona o crea una nota</div>
  </div>

<script>
  // 1. Sincronización de Tema con MyHub
  if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'myhub:tema:res') {
      document.documentElement.dataset.modo = e.data.modo;
      document.documentElement.style.setProperty('--accent', e.data.color);
    }
  });

  // 2. Lógica de la App
  let notes = JSON.parse(localStorage.getItem('myhub_notas') || '[]');
  let activeId = notes.length ? notes[0].id : null;
  
  const listEl = document.getElementById('notes-list');
  const editorEl = document.getElementById('editor-area');

  const saveToStorage = () => {
    localStorage.setItem('myhub_notas', JSON.stringify(notes));
  };

  const formatDate = (iso) => {
    return new Date(iso).toLocaleDateString('es', { day: '2-digit', month: 'short' });
  };

  const renderList = () => {
    listEl.innerHTML = '';
    notes.sort((a, b) => b.updatedAt - a.updatedAt).forEach(note => {
      const div = document.createElement('div');
      div.className = 'note-item' + (note.id === activeId ? ' active' : '');
      div.innerHTML = `
        <div class="note-item-title">${note.title || 'Sin título'}</div>
        <div class="note-item-date">${formatDate(note.updatedAt)}</div>
      `;
      div.onclick = () => {
        activeId = note.id;
        renderList();
        renderEditor();
      };
      listEl.appendChild(div);
    });
  };

  const renderEditor = () => {
    const note = notes.find(n => n.id === activeId);
    if (!note) {
      editorEl.innerHTML = `<div class="empty-state">Selecciona o crea una nota</div>`;
      return;
    }

    editorEl.innerHTML = `
      <div class="editor-header">
        <input type="text" class="title-input" id="input-title" value="${note.title.replace(/"/g, '&quot;')}" placeholder="Título de la nota...">
      </div>
      <textarea class="content-input" id="input-content" placeholder="Escribe algo aquí...">${note.content}</textarea>
    `;

    const titleIn = document.getElementById('input-title');
    const contentIn = document.getElementById('input-content');

    const updateNote = () => {
      note.title = titleIn.value;
      note.content = contentIn.value;
      note.updatedAt = Date.now();
      saveToStorage();
      
      const activeListItem = listEl.querySelector('.note-item.active .note-item-title');
      if (activeListItem) activeListItem.textContent = note.title || 'Sin título';
      
      renderList();
      const items = listEl.querySelectorAll('.note-item');
      const currentIndex = notes.sort((a, b) => b.updatedAt - a.updatedAt).findIndex(n => n.id === activeId);
      if (items[currentIndex]) items[currentIndex].classList.add('active');
    };

    titleIn.oninput = updateNote;
    contentIn.oninput = updateNote;
  };

  // Nueva Nota
  document.getElementById('btn-new').onclick = () => {
    const newNote = {
      id: 'note_' + Date.now(),
      title: '',
      content: '',
      updatedAt: Date.now()
    };
    notes.unshift(newNote);
    activeId = newNote.id;
    saveToStorage();
    renderList();
    renderEditor();
    document.getElementById('input-title').focus();
  };

  // Exportar a TXT
  document.getElementById('btn-export').onclick = () => {
    const note = notes.find(n => n.id === activeId);
    if (!note) return alert('Selecciona una nota para exportar.');
    
    // Formatear el texto para el archivo
    const textToExport = `Título: ${note.title || 'Sin título'}\nFecha: ${new Date(note.updatedAt).toLocaleString('es')}\n\n${note.content}`;
    
    // Crear el archivo y descargarlo
    const blob = new Blob([textToExport], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${note.title || 'Nota'}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  };

  // Importar desde TXT
  document.getElementById('btn-import').onclick = () => {
    document.getElementById('file-import').click();
  };

  document.getElementById('file-import').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (ev) => {
      const content = ev.target.result;
      
      // Crear una nueva nota con el contenido del archivo
      const newNote = {
        id: 'note_' + Date.now(),
        title: file.name.replace('.txt', ''),
        content: content,
        updatedAt: Date.now()
      };
      
      notes.unshift(newNote);
      activeId = newNote.id;
      saveToStorage();
      renderList();
      renderEditor();
    };
    
    reader.readAsText(file);
    e.target.value = ''; // Limpiar el input para permitir importar el mismo archivo de nuevo
  };

  // Iniciar
  renderList();
  renderEditor();
</script>
</body>
</html>
