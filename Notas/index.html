<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: #2563eb;
    --bg: transparent;
    --text: #0b1220;
    --muted: #64748b;
    --line: rgba(15, 23, 42, 0.08);
    --card: #ffffff;
    --field: #f6f8fb;
  }
  
  html[data-modo="oscuro"] {
    --text: #f4f4f6;
    --muted: #9ea1aa;
    --line: rgba(255, 255, 255, 0.09);
    --card: #222227;
    --field: #2a2a31;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    font-family: 'Segoe UI Variable', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;
  }

  /* Barra lateral */
  .sidebar {
    width: 170px;
    background: var(--field);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    flex-shrink: 0;
  }
  
  .sidebar-header {
    padding: 16px 12px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  
  .sidebar-header h2 { margin: 0; font-size: 13px; font-weight: 700; }
  
  .btn-add {
    background: var(--accent); color: #fff; border: none;
    width: 26px; height: 26px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; font-weight: bold;
    transition: transform 0.15s;
  }
  .btn-add:hover { transform: scale(1.05); }

  .notes-list { flex: 1; overflow-y: auto; padding: 8px; }
  
  /* ESTILO UNIFICADO: HOVER Y ACTIVE SON IGUALES */
  .note-item {
    padding: 10px; border-radius: 8px; cursor: pointer;
    display: flex; flex-direction: column; gap: 4px;
    margin-bottom: 2px;
    /* Añadimos transición para que el cambio de color sea suave */
    transition: background 0.15s, color 0.15s;
  }
  
  .note-item:hover, 
  .note-item.active { 
    background: var(--accent); 
    color: #fff; 
  }
  
  .note-item-title {
    font-size: 12.5px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .note-item-date { font-size: 11px; opacity: 0.7; }

  /* Área del editor */
  .editor {
    flex: 1; display: flex; flex-direction: column;
    background: var(--card); min-width: 0;
  }
  
  .editor-header { 
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--line); 
  }
  
  input.title-input {
    width: 100%; border: none; background: transparent;
    font-size: 22px; font-weight: 700; color: var(--text);
    outline: none; font-family: inherit;
  }
  
  textarea.content-input {
    flex: 1; width: 100%; border: none; background: transparent;
    padding: 20px 24px;
    font-size: 15px; line-height: 1.6;
    color: var(--text); outline: none; resize: none;
    font-family: inherit;
  }

  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; font-style: italic;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Notas</h2>
      <button class="btn-add" id="btn-new" title="Nueva nota">+</button>
    </div>
    <div class="notes-list" id="notes-list"></div>
  </div>

  <div class="editor" id="editor-area">
    <div class="empty-state">Selecciona o crea una nota</div>
  </div>

<script>
  // 1. Sincronización de Tema con MyHub
  if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'myhub:tema:res') {
      document.documentElement.dataset.modo = e.data.modo;
      document.documentElement.style.setProperty('--accent', e.data.color);
    }
  });

  // 2. Lógica de la App
  let notes = JSON.parse(localStorage.getItem('myhub_notas') || '[]');
  let activeId = notes.length ? notes[0].id : null;
  
  const listEl = document.getElementById('notes-list');
  const editorEl = document.getElementById('editor-area');

  const saveToStorage = () => {
    localStorage.setItem('myhub_notas', JSON.stringify(notes));
  };

  const formatDate = (iso) => {
    return new Date(iso).toLocaleDateString('es', { day: '2-digit', month: 'short' });
  };

  const renderList = () => {
    listEl.innerHTML = '';
    notes.sort((a, b) => b.updatedAt - a.updatedAt).forEach(note => {
      const div = document.createElement('div');
      div.className = 'note-item' + (note.id === activeId ? ' active' : '');
      div.innerHTML = `
        <div class="note-item-title">${note.title || 'Sin título'}</div>
        <div class="note-item-date">${formatDate(note.updatedAt)}</div>
      `;
      div.onclick = () => {
        activeId = note.id;
        renderList();
        renderEditor();
      };
      listEl.appendChild(div);
    });
  };

  const renderEditor = () => {
    const note = notes.find(n => n.id === activeId);
    if (!note) {
      editorEl.innerHTML = `<div class="empty-state">Selecciona o crea una nota</div>`;
      return;
    }

    editorEl.innerHTML = `
      <div class="editor-header">
        <input type="text" class="title-input" id="input-title" value="${note.title.replace(/"/g, '&quot;')}" placeholder="Título de la nota...">
      </div>
      <textarea class="content-input" id="input-content" placeholder="Escribe algo aquí...">${note.content}</textarea>
    `;

    const titleIn = document.getElementById('input-title');
    const contentIn = document.getElementById('input-content');

    const updateNote = () => {
      note.title = titleIn.value;
      note.content = contentIn.value;
      note.updatedAt = Date.now();
      saveToStorage();
      
      const activeListItem = listEl.querySelector('.note-item.active .note-item-title');
      if (activeListItem) activeListItem.textContent = note.title || 'Sin título';
      
      renderList();
      const items = listEl.querySelectorAll('.note-item');
      const currentIndex = notes.sort((a, b) => b.updatedAt - a.updatedAt).findIndex(n => n.id === activeId);
      if (items[currentIndex]) items[currentIndex].classList.add('active');
    };

    titleIn.oninput = updateNote;
    contentIn.oninput = updateNote;
  };

  document.getElementById('btn-new').onclick = () => {
    const newNote = {
      id: 'note_' + Date.now(),
      title: '',
      content: '',
      updatedAt: Date.now()
    };
    notes.unshift(newNote);
    activeId = newNote.id;
    saveToStorage();
    renderList();
    renderEditor();
    document.getElementById('input-title').focus();
  };

  renderList();
  renderEditor();
</script>
</body>
</html>
