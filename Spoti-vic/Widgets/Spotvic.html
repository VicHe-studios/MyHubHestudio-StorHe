<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root {
    --accent: #2563eb;
    --text: #0b1220;
    --muted: #64748b;
    --line: rgba(15, 23, 42, 0.08);
  }
  html[data-modo="oscuro"] {
    --text: #f4f4f6;
    --muted: #9ea1aa;
    --line: rgba(255, 255, 255, 0.09);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; width: 100vw;
    background: transparent; overflow: hidden; border-radius: 16px;
    font-family: 'Segoe UI Variable', system-ui, sans-serif;
    color: var(--text);
  }

  .widget {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 16px;
    gap: 6px;
  }

  .title {
    font-size: 14px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.2;
  }

  .row {
    display: flex; align-items: center; gap: 12px;
  }

  .time {
    font-size: 11px; font-weight: 600; color: var(--muted);
    min-width: 65px;
  }

  .progress {
    flex: 1; height: 4px; border-radius: 2px;
    background: var(--line); overflow: hidden;
  }
  .progress-bar {
    height: 100%; background: var(--accent); border-radius: 2px;
    transition: width 0.4s linear; width: 0%;
  }

  /* Estado vacío */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; color: var(--muted); gap: 6px;
    border-radius: 16px; border: 1px dashed var(--line);
  }
  .empty-state svg { width: 24px; height: 24px; opacity: 0.5; }
  .empty-state span { font-size: 11px; font-weight: 600; }
</style>
</head>
<body>

  <div class="widget" id="main" style="display:none;">
    <div class="title" id="title">-</div>
    <div class="row">
      <span class="time" id="time">0:00 / 0:00</span>
      <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
    </div>
  </div>

  <div class="empty-state" id="empty" style="display:none;">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <span>Spoti-vic vacío</span>
  </div>

<script>
  if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'myhub:tema:res') {
      document.documentElement.dataset.modo = e.data.modo;
      document.documentElement.style.setProperty('--accent', e.data.color);
    }
  });

  const NP_KEY = 'spoti_vic_nowplaying';
  const DB_NAME = 'spoti_vic_db';
  const DB_VERSION = 2;

  const $ = id => document.getElementById(id);
  const mainEl = $('main'), emptyEl = $('empty');
  const titleEl = $('title'), timeEl = $('time'), progressBar = $('progress-bar');

  let libraryCache = { songs: [], ts: 0 };

  function formatTime(s) {
    if (!s || isNaN(s)) return '0:00';
    s = Math.floor(s);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  function openDB() {
    return new Promise((res) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
    });
  }

  async function loadLibrary() {
    try {
      const db = await openDB();
      if (!db) return libraryCache;
      const tx = db.transaction('songs', 'readonly');
      const r = tx.objectStore('songs').getAll();
      await new Promise(res => tx.oncomplete = res);
      libraryCache = { songs: r.result || [], ts: Date.now() };
    } catch (e) {}
    return libraryCache;
  }

  async function render() {
    const now = Date.now();
    const raw = localStorage.getItem(NP_KEY);
    let np = null;
    try { np = raw ? JSON.parse(raw) : null; } catch (e) {}

    if (np) {
      mainEl.style.display = 'flex';
      emptyEl.style.display = 'none';

      // Formato: "Canción - Artista" (como en Android)
      titleEl.textContent = np.artist && np.artist !== 'Desconocido' 
        ? `${np.title} - ${np.artist}` 
        : np.title;

      timeEl.textContent = `${formatTime(np.currentTime)} / ${formatTime(np.duration)}`;
      
      const pct = (np.duration > 0) ? (np.currentTime / np.duration) * 100 : 0;
      progressBar.style.width = pct + '%';
      return;
    }

    // Modo 2: Última canción (Fallback)
    const lib = (libraryCache.ts && (now - libraryCache.ts < 10000))
      ? libraryCache : await loadLibrary();

    if (lib.songs.length === 0) {
      mainEl.style.display = 'none';
      emptyEl.style.display = 'flex';
      return;
    }

    const recent = [...lib.songs].sort((a, b) => (b.date || 0) - (a.date || 0))[0];

    mainEl.style.display = 'flex';
    emptyEl.style.display = 'none';

    titleEl.textContent = recent.artist && recent.artist !== 'Desconocido'
        ? `${recent.title} - ${recent.artist}` 
        : recent.title;
    timeEl.textContent = '0:00 / 0:00';
    progressBar.style.width = '0%';
  }

  render();
  setInterval(render, 1000);
  window.addEventListener('storage', (e) => {
    if (e.key === NP_KEY) render();
  });
</script>
</body>
</html>
