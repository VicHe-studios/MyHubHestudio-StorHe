<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.15);
    --text: #0b1220;
    --muted: #64748b;
    --line: rgba(15, 23, 42, 0.08);
    --card: #ffffff;
    --field: #f6f8fb;
    --canvas-bg: #ffffff;
  }
  
  html[data-modo="oscuro"] {
    --text: #f4f4f6;
    --muted: #9ea1aa;
    --line: rgba(255, 255, 255, 0.09);
    --card: #222227;
    --field: #2a2a31;
    --canvas-bg: #1a1a1f;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: 'Segoe UI Variable', system-ui, sans-serif;
    background: var(--card); color: var(--text);
    overflow: hidden;
  }

  /* Barra de herramientas más compacta */
  .toolbar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; border-bottom: 1px solid var(--line);
    background: var(--card); flex-shrink: 0;
    overflow-x: auto; /* Por si la ventana es muy angosta */
  }
  
  .tool-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .divider { width: 1px; height: 20px; background: var(--line); margin: 0 4px; flex-shrink: 0; }

  /* Paleta de colores de MyHub */
  .palette { display: flex; gap: 6px; }
  .swatch {
    width: 24px; height: 24px; border-radius: 6px; cursor: pointer;
    border: 2px solid transparent; transition: transform 0.15s;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch.active { border-color: var(--text); box-shadow: 0 0 0 1px var(--card) inset; }
  
  /* Colores fijos */
  .c-blue { background: #2563eb; }
  .c-sky { background: #0ea5e9; }
  .c-red { background: #dc2626; }
  .c-green { background: #16a34a; }
  .c-purple { background: #7c3aed; }
  .c-yellow { background: #ca8a04; }
  .c-black { background: #0b1220; }
  .c-white { background: #ffffff; border-color: var(--line); }

  input[type="range"] { width: 60px; accent-color: var(--accent); }

  .btn-tool {
    background: var(--field); border: 1px solid var(--line); color: var(--text);
    width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .btn-tool:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-tool.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-tool:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-tool svg { width: 14px; height: 14px; }

  .btn-text { width: auto; padding: 0 10px; font-weight: 600; font-size: 12px; gap: 6px; }

  .canvas-container {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: var(--field); padding: 12px; overflow: hidden;
  }
  
  canvas {
    background: var(--canvas-bg);
    border-radius: 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    cursor: crosshair;
    touch-action: none;
    border: 1px solid var(--line);
  }

  .app-credit {
    text-align: center; font-size: 11px; color: var(--muted); padding: 6px;
    background: var(--card); border-top: 1px solid var(--line); flex-shrink: 0;
  }
</style>
</head>
<body>

  <div class="toolbar">
    <div class="tool-group">
      <button class="btn-tool active" id="tool-pencil" title="Pincel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
      </button>
      <button class="btn-tool" id="tool-eraser" title="Borrador">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16a2 2 0 0 1 0-2.828l9.172-9.172a2 2 0 0 1 2.828 0l4.242 4.242a2 2 0 0 1 0 2.828L11 20"></path><line x1="18" y1="13" x2="11" y2="20"></line></svg>
      </button>
    </div>

    <div class="divider"></div>

    <div class="tool-group">
      <button class="btn-tool" id="btn-undo" title="Deshacer (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
      </button>
      <button class="btn-tool" id="btn-redo" title="Rehacer (Ctrl+Y)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path></svg>
      </button>
    </div>

    <div class="divider"></div>

    <!-- Paleta de colores fija del S.O. -->
    <div class="tool-group palette">
      <div class="swatch c-black" data-color="#0b1220" title="Negro"></div>
      <div class="swatch c-white" data-color="#ffffff" title="Blanco"></div>
      <div class="swatch c-blue active" data-color="#2563eb" title="Azul"></div>
      <div class="swatch c-sky" data-color="#0ea5e9" title="Celeste"></div>
      <div class="swatch c-red" data-color="#dc2626" title="Rojo"></div>
      <div class="swatch c-green" data-color="#16a34a" title="Verde"></div>
      <div class="swatch c-purple" data-color="#7c3aed" title="Morado"></div>
      <div class="swatch c-yellow" data-color="#ca8a04" title="Amarillo"></div>
    </div>

    <div class="tool-group">
      <input type="range" id="size-picker" min="1" max="30" value="4" title="Grosor">
    </div>

    <div class="tool-group" style="margin-left: auto;">
      <button class="btn-tool btn-text" id="btn-clear" title="Limpiar todo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>
      <button class="btn-tool btn-text" id="btn-save" title="Descargar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </button>
    </div>
  </div>

  <div class="canvas-container" id="canvas-container">
    <canvas id="paint-canvas"></canvas>
  </div>

  <div class="app-credit">
    Hecho con ❤️ por VicHeStudios usando HTML5 Canvas
  </div>

<script>
  if (window.parent !== window) window.parent.postMessage({ type: 'myhub:get-tema' }, '*');
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'myhub:tema:res') {
      document.documentElement.dataset.modo = e.data.modo;
      document.documentElement.style.setProperty('--accent', e.data.color);
      document.documentElement.style.setProperty('--accent-soft', e.data.color + '26');
    }
  });

  const canvas = document.getElementById('paint-canvas');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('canvas-container');
  
  let isDrawing = false;
  let currentTool = 'pencil';
  let currentColor = '#2563eb';
  let currentSize = 4;

  let history = [];
  let historyIndex = -1;
  const btnUndo = document.getElementById('btn-undo');
  const btnRedo = document.getElementById('btn-redo');

  const saveState = () => {
    if (historyIndex < history.length - 1) {
      history = history.slice(0, historyIndex + 1);
    }
    history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    historyIndex++;
    updateButtons();
  };

  const updateButtons = () => {
    btnUndo.disabled = historyIndex <= 0;
    btnRedo.disabled = historyIndex >= history.length - 1;
  };

  const resizeCanvas = () => {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    if (canvas.width > 0 && canvas.height > 0) {
      tempCanvas.getContext('2d').drawImage(canvas, 0, 0);
    }

    const rect = container.getBoundingClientRect();
    canvas.width = rect.width - 24;
    canvas.height = rect.height - 24;

    if (tempCanvas.width > 0) {
      ctx.drawImage(tempCanvas, 0, 0);
    }
    
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    // Evitar reiniciar el historial si no hubo un cambio de tamaño real
    if (tempCanvas.width !== canvas.width || tempCanvas.height !== canvas.height) {
      history = [];
      historyIndex = -1;
      saveState();
    }
  };

  window.addEventListener('resize', resizeCanvas);
  setTimeout(resizeCanvas, 100);

  const startDrawing = (e) => {
    isDrawing = true;
    draw(e);
  };

  const draw = (e) => {
    if (!isDrawing) return;
    const rect = canvas.getBoundingClientRect();
    let x, y;
    
    if (e.type.includes('touch')) {
      x = e.touches[0].clientX - rect.left;
      y = e.touches[0].clientY - rect.top;
    } else {
      x = e.clientX - rect.left;
      y = e.clientY - rect.top;
    }

    ctx.lineWidth = currentSize;
    
    if (currentTool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = currentColor;
    }

    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  };

  const stopDrawing = () => {
    if (!isDrawing) return;
    isDrawing = false;
    ctx.beginPath();
    saveState();
  };

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseout', stopDrawing);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
  canvas.addEventListener('touchend', stopDrawing);

  // Selección de color desde la paleta
  document.querySelectorAll('.swatch').forEach(sw => {
    sw.onclick = () => {
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      currentColor = sw.dataset.color;
      document.getElementById('tool-pencil').click(); // Cambia a pincel
    };
  });

  document.getElementById('size-picker').oninput = (e) => { currentSize = e.target.value; };

  document.getElementById('tool-pencil').onclick = (e) => {
    currentTool = 'pencil';
    e.currentTarget.classList.add('active');
    document.getElementById('tool-eraser').classList.remove('active');
  };

  document.getElementById('tool-eraser').onclick = (e) => {
    currentTool = 'eraser';
    e.currentTarget.classList.add('active');
    document.getElementById('tool-pencil').classList.remove('active');
  };

  const doUndo = () => {
    if (historyIndex > 0) {
      historyIndex--;
      ctx.putImageData(history[historyIndex], 0, 0);
      updateButtons();
    }
  };

  const doRedo = () => {
    if (historyIndex < history.length - 1) {
      historyIndex++;
      ctx.putImageData(history[historyIndex], 0, 0);
      updateButtons();
    }
  };

  btnUndo.onclick = doUndo;
  btnRedo.onclick = doRedo;

  // ATAJOS DE TECLADO (Ctrl+Z, Ctrl+Y, Ctrl+Shift+Z)
  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey) {
      if (e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) doRedo();
        else doUndo();
      }
      if (e.key.toLowerCase() === 'y') {
        e.preventDefault();
        doRedo();
      }
    }
  });

  document.getElementById('btn-clear').onclick = () => {
    if(confirm('¿Seguro que quieres borrar todo el dibujo?')) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      saveState();
    }
  };

  document.getElementById('btn-save').onclick = () => {
    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = canvas.width;
    exportCanvas.height = canvas.height;
    const exportCtx = exportCanvas.getContext('2d');
    
    const isDark = document.documentElement.dataset.modo === 'oscuro';
    exportCtx.fillStyle = isDark ? '#1a1a1f' : '#ffffff';
    exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
    exportCtx.drawImage(canvas, 0, 0);
    
    const link = document.createElement('a');
    link.download = `MiDibujo_${Date.now()}.png`;
    link.href = exportCanvas.toDataURL('image/png');
    link.click();
  };
</script>
</body>
</html>
